version: "v0.4"

project:
  name: "Quotient Fundamental Groups, Winding, and Smith Exactness"
  description: >-
    Follow-up formalization of a concrete winding-word/Smith certificate for
    quotient fundamental groups of finite tori.  The selected declaration is
    a kernel-checked topology-to-arithmetic synthesis: covering-map images,
    the sharp product-quotient boundary, rectangular cokernel exactness, and
    induced finite-torus matrix maps are combined with a fixed list syntax whose
    realization is concatenation of standard topological loops.  Trace length
    is List.length, and the zero/one normal-form laws are proved from that
    syntax.  Classical ingredients and priority are not claimed as new.
  authors:
    - "Arthur Freitas Ramos"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina Grisi de Oliveira"
    - "Tiago M. L. de Veras"
    - "David Barros Hulak"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

