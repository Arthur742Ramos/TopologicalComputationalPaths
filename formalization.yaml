version: "v0.4"

project:
  name: "Path-Choice Centrality with Finite-Torus Winding and Lattice Smith Profiles"
  description: >-
    This follow-up selects the two-part Lean certificate
    `TopologicalComputationalPathsFollowup.main_result`.  Its principal
    contribution is an explicit coherence theorem for quotient-
    topological fundamental groups: two continuous multiplicative basepoint
    transports agree if and only if their relative loop is central in the
    target quotient.  The theorem is proved for every pointed topological
    space and is packaged with functoriality, homotopy/basepoint invariance,
    and the sharp binary product-quotient boundary.  The product statement
    assumes that the product of the two loop-quotient projections is a
    quotient map and makes no arbitrary indexed-product claim.  The selected
    certificate therefore distinguishes its binary theorem from broader
    indexed constructions elsewhere in the repository.
    The second part provides, for every finite `n`, a complete winding and
    standard-loop classification of the based finite torus by
    `Fin n → ℤ`, including coordinate naturality, continuous multiplicative
    quotient equivalences, arbitrary-basepoint and path-independent forms,
    commutativity, discreteness, openness, and semilocal simple connectivity.
    The same selected structure contains an algebraic lattice-cokernel layer:
    square and rectangular short-exact sequences, lcm and coprime-product
    exponent laws, determinant-coprime and
    prime-support criteria, and the explicitly named Smith-factor lcm,
    Smith-factor prime-support, exponent p-adic, and class-order p-adic
    profile fields.  Winding and Smith ingredients are classical; the claimed
    mathematical contribution is the exact centrality criterion together with
    its coherent quotient-topological boundary.  The Lean certificate is its
    checked presentation, not a substitute for that mathematical claim, and
    no priority claim is made for the classical calculations.  Broader
    matrix-map,
    determinant-cardinality,
    Chinese-remainder, free-factor, annihilator, image, kernel, and
    injectivity/surjectivity developments remain repository support and are
    not attributed to this selected result unless listed in `main_results`.
  authors:
    - "Arthur Freitas Ramos"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina Grisi de Oliveira"
    - "Tiago M. L. de Veras"
    - "David Barros Hulak"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

