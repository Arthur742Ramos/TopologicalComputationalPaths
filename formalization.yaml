version: "v0.4"

project:
  name: "Topological Smith Classification and Composition for Finite-Torus Quotients"
  description: >-
    This follow-up selects
    `TopologicalComputationalPathsFollowup.topological_smith_exactness`.
    It is a checked comparison theorem for quotient fundamental groups of
    finite tori under arbitrary rectangular integer-matrix maps.  The
    certificate first identifies every quotient loop group with the integer
    winding lattice by an explicit homeomorphism.  It then transports a
    rectangular short-exact cokernel sequence across that model, including
    both naturality squares and the square first-isomorphism quotient.  The
    composition profile proves multiplicativity of cokernel cardinalities,
    the exact finite/infinite boundary, prime-support union, and the coprime
    exponent product law.  Finally it gives an arbitrary-rank Smith
    decomposition of each topological cokernel, including `ZMod 0` free
    factors and a prime-power refinement in the finite case, and recovers the
    nonsingular square determinant index.  Thus the selected result is a
    reusable topology--algebra composition and classification theorem: it
    connects actual quotient topology to rectangular exactness, detects free
    versus torsion directions without a full-rank hypothesis, and exposes
    computable composition invariants.  Winding, quotient fundamental groups,
    short exact sequences, first-isomorphism arguments, Smith normal form, and
    prime-power factorization are classical ingredients; the originality claim
    is limited to this exact bundled composition-and-classification theorem.
    Broader quotient-topology, centrality, indexed-product, CRT, and matrix
    APIs elsewhere in the repository are supporting material, not selected
    claims.
  authors:
    - "Arthur Freitas Ramos"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina Grisi de Oliveira"
    - "Tiago M. L. de Veras"
    - "David Barros Hulak"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

