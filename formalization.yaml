alignment:
  namespace: "TopologicalComputationalPathsFollowup"
  statements:
    - source: "Finite-torus winding classifier and matrix-map naturality"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.winding_matrix_compatibility"
      module: "FollowupSolution.lean"
      status: "proved"
      note: >-
        The explicit winding classifier is complete on every finite-torus
        quotient, identifies quotient concatenation with lattice addition
        through a continuous equivalence into the multiplicative lattice
        model, and commutes with the induced integer-matrix map.  Its image,
        injectivity, and surjectivity are characterized by the corresponding
        lattice action, with determinant criteria in the square case; quotient-
        level matrix composition is also stated.
    - source: "Winding-compatible rectangular lattice composition"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.matrix_composition"
      module: "FollowupSolution.lean"
      status: "proved"
      note: >-
        The canonical additive matrix action composes according to the stated
        row-by-column `matrixCompose` law in all finite dimensions.
    - source: "Rectangular lattice-cokernel composition profile"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.rectangular_composition_profile"
      module: "FollowupSolution.lean"
      status: "proved"
      note: >-
        Under injectivity of the second rectangular lattice action, when both
        successive lattice cokernels are finite, their ordinary
        cardinalities multiply and their prime support is the union of the
        successive supports; the field also proves the finiteness equivalence
        and the coprime-exponent identity.  Outside that finite regime the
        certificate makes no ordinary cardinality or torsion-support claim.
    - source: "Arbitrary-rank Smith classification of the winding-lattice cokernel"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.smith_cokernel_profile"
      module: "FollowupSolution.lean"
      status: "proved"
      note: >-
        The selected field gives the additive Smith equivalence, preserves
        `ZMod 0` free factors, characterizes lattice-cokernel finiteness by
        full target rank, and identifies the exponent from the Smith moduli.
        Its prime-support statement is explicitly conditional on finite
        cokernel; a zero modulus is handled as a free direction with the
        totalized exponent-zero convention.
    - source: "Square determinant-index specialization"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.determinant_index"
      module: "FollowupSolution.lean"
      status: "proved"
      note: >-
        For a nonsingular square matrix, the winding-lattice cokernel
        cardinality equals the absolute determinant.
    - source: "Finite prime-power Smith refinement"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.prime_power_torsion_profile"
      module: "FollowupSolution.lean"
      status: "proved"
      note: >-
        When every Smith modulus is nonzero, the finite winding-lattice
        cokernel is explicitly equivalent to its product of prime-power cyclic
        factors, with the exact product cardinality formula.

