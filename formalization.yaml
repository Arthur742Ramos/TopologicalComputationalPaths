version: "v0.4"

project:
  name: "Functorial Quotient Fundamental Groups and Finite-Torus Cokernel Profiles"
  description: >-
    This follow-up selects the two-part Lean certificate
    `TopologicalComputationalPathsFollowup.main_result`.  Its first part is a
    functorial theory of the quotient-topological fundamental group of an
    arbitrary pointed space: induced maps are continuous and preserve identity,
    composition, and path-class concatenation; homeomorphisms, homotopy
    equivalences, and basepoint changes give the stated invariances; T1 and
    discreteness boundaries, semilocal consequences, covering-map consequences,
    and the topological-group agreement boundary are proved.  Its product
    theorem is deliberately binary: it preserves the product only when the
    product of the two quotient projections is assumed to be a quotient map.
    The certificate does not claim arbitrary indexed-product preservation.
    The second part provides, for every finite `n`, a complete winding and
    standard-loop classification of the based finite torus by
    `Fin n → ℤ`, including coordinate naturality, continuous multiplicative
    quotient equivalences, arbitrary-basepoint and path-independent forms,
    commutativity, discreteness, openness, and semilocal simple connectivity.
    The same selected structure contains an algebraic matrix-cokernel layer:
    square and rectangular short-exact sequences, lcm and coprime-product
    exponent laws, determinant-coprime and prime-support criteria, and the
    explicitly named Smith-factor lcm, Smith-factor prime-support, exponent
    p-adic, and class-order p-adic profile fields.  These are the matrix and
    Smith-normal-form results established by the selected declaration.  The
    repository also contains broader matrix-map, determinant-cardinality,
    Chinese-remainder, free-factor, annihilator, image, kernel, and
    injectivity/surjectivity developments; those supporting declarations are
    not attributed to this selected result unless listed in `main_results`.
  authors:
    - "Arthur Freitas Ramos"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina Grisi de Oliveira"
    - "Tiago M. L. de Veras"
    - "David Barros Hulak"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

repository:
  role: "substantive-development"

