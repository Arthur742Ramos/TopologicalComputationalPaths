research_interest:
  audience: "Researchers in algebraic topology, geometric group theory, general topology, and formalized mathematics"
  selected_contribution: >-
    `TopologicalComputationalPathsFollowup.topological_smith_exactness` is a
    topology--algebra composition and classification theorem for maps of
    finite-torus quotient fundamental groups.  It exposes a single reusable
    certificate whose first field is a quotient-to-lattice homeomorphism,
    whose rectangular part proves short exactness, naturality, the square
    first-isomorphism quotient, and the exact composition laws for cardinality,
    finiteness, exponent, and prime support, and whose Smith part classifies
    the resulting cokernel at arbitrary rank, including its free directions,
    finite/full-rank boundary, prime-power factors, exponent, and prime
    support.  The determinant-index identity is then the nonsingular square
    specialization of the same topological object.
  why_nontrivial: >-
    The result is not just an isolated cardinality calculation or a list of
    lattice lemmas.  It identifies the actual quotient fundamental group with
    the winding lattice by a homeomorphism, proves that rectangular exactness
    and the square first-isomorphism quotient survive that comparison, and
    gives an exact composition calculus for the resulting topological
    cokernels.  One Smith profile then distinguishes free from torsion
    obstruction in every target dimension and refines finite cases into
    prime-power factors.  The finite criterion and prime-support law remain
    meaningful for singular and rectangular maps, while the determinant
    formula follows only after the square nonsingularity specialization.  This
    common composition-and-classification theorem is what makes the result
    reusable for induced maps between finite-torus quotient groups.
  paper_worthiness: >-
    The selected theorem group supplies a compact, auditable bridge between
    quotient topology and computable integer invariants: a homeomorphic
    winding model, a natural rectangular short-exact diagram, a square
    first-isomorphism quotient, exact composition laws for successive
    cokernels, an arbitrary-rank Smith/prime-power classification with
    explicit free factors, and a determinant-index specialization all refer
    to one canonical topological cokernel.  It can serve as a reusable
    composition-and-classification theorem for finite-torus maps rather than
    as a proof-size report.  The claim is a first presentation of this exact
    combined theorem, with the classical ingredients and their literature
    boundary stated openly; it does not claim first discovery of winding or
    Smith normal form.
  literature_boundary: >-
    Hatcher and Norman provide the classical winding and Smith/invariant-factor
    background, while Brazas--Fabel and Calcut--McCarthy provide the
    quotient-topological context.  The parent computational-path manuscript
    is recorded as background and the pinned Mathlib revision as a related
    formalization dependency.  The exact combination selected by the
    certificate was not identified as a single theorem in those sources; the
    local source is therefore recorded as `original-proof` with relationship
    `other`.  That originality claim is deliberately limited to the bundled
    winding-homeomorphism, rectangular exactness and composition laws, square
    first-isomorphism quotient, Smith/prime-power classification, and
    determinant statement and does not claim priority for any classical
    ingredient.
  evidence:
    - "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean: TopologicalSmithExactnessCertificate.topological_winding_homeomorph"
    - "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean: TopologicalSmithExactnessCertificate.rectangular_winding_short_exact"
    - "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean: TopologicalSmithExactnessCertificate.first_isomorphism_quotient"
    - "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean: TopologicalSmithExactnessCertificate.rectangular_composition_profile"
    - "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean: TopologicalSmithExactnessCertificate.smith_cokernel_profile"
    - "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean: TopologicalSmithExactnessCertificate.determinant_index_compatibility"
    - "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean: TopologicalSmithExactnessCertificate.prime_power_torsion_profile"
    - "FollowupSolution.lean: TopologicalComputationalPathsFollowup.topological_smith_exactness"

