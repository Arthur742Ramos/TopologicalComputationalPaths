status:
  scope: >-
    The selected declaration is
    TopologicalComputationalPathsFollowup.topological_smith_exactness in
    FollowupSolution.lean.  It is a Nonempty
    TopologicalSmithExactnessCertificate with nine top-level fields:
    monodromy-stabilizer image equality for covering maps; the sharp
    product-quotient obstruction; rectangular winding-lattice cokernel
    short exactness; a complete finite-torus winding classifier with actual
    induced matrix-map image, injectivity, and surjectivity criteria; matrix
    composition; rectangular finite-cokernel profiles; arbitrary-rank Smith
    decomposition with explicit ZMod 0 free directions; the nonsingular
    determinant-index formula; and a finite prime-power refinement.  The
    classifier's nested concrete_winding_word_bridge fixes
    WindingWord n to List (Fin n -> Int), fixes traceLength to List.length,
    realizes a word by concatenating standard torus loops, and proves the
    representation, winding, homotopy, matrix-naturality, Smith-realizability,
    and shortest zero/one normal-form laws.  No arbitrary raw family,
    certificate-supplied cost observable, or unstructured homeomorphism is
    part of the selected trace result.  Cardinality and prime-support claims
    remain explicitly restricted to finite cokernels; zero Smith factors are
    retained as ZMod 0 free directions with Mathlib's totalized conventions.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "TopologicalComputationalPathsFollowup.topological_smith_exactness"
      file: "FollowupSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-followup.json"
      selected_fields:
        - "TopologicalSmithExactnessCertificate.covering_map_image_is_monodromy_stabilizer"
        - "TopologicalSmithExactnessCertificate.quotient_product_hypothesis_sharp"
        - "TopologicalSmithExactnessCertificate.rectangular_cokernel_short_exact"
        - "TopologicalSmithExactnessCertificate.winding_matrix_compatibility"
        - "FiniteTorusWindingMatrixCompatibility.matrix_map_smith_image_iff"
        - "FiniteTorusWindingMatrixCompatibility.concrete_winding_word_bridge"
        - "TopologicalSmithExactnessCertificate.matrix_composition"
        - "TopologicalSmithExactnessCertificate.rectangular_composition_profile"
        - "TopologicalSmithExactnessCertificate.smith_cokernel_profile"
        - "TopologicalSmithExactnessCertificate.determinant_index"
        - "TopologicalSmithExactnessCertificate.prime_power_torsion_profile"
      literature_dependencies:
        - statement: "Circle and finite-product winding classification"
          source: "Algebraic Topology"
        - statement: "Smith invariant factors and determinant index"
          source: "Finitely Generated Abelian Groups and Similarity of Matrices over a Field"
        - statement: "Quotient-topological fundamental-group context"
          source: "On Fundamental Groups with the Quotient Topology"
