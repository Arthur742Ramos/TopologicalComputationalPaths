alignment:
  namespace: "TopologicalComputationalPathsFollowup"
  statements:
    - source: "Finite-torus quotient-to-winding homeomorphism"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.topological_winding_homeomorph"
      module: "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean"
      status: "proved"
      note: >-
        The compact-open/final quotient loop space of every finite torus is
        homeomorphic to its integer winding lattice.
    - source: "Winding-compatible rectangular topological Smith exactness"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.rectangular_winding_short_exact"
      module: "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean"
      status: "proved"
      note: >-
        For composable rectangular integer matrices, the actual finite-torus
        quotient cokernel and the winding-lattice cokernel have the same
        injectivity, kernel=image, and surjectivity sequence, and both
        winding comparison squares commute.
    - source: "First-isomorphism quotient for composable torus maps"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.first_isomorphism_quotient"
      module: "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean"
      status: "proved"
      note: >-
        Quotienting the square composite cokernel by the projection kernel
        recovers the second topological cokernel by an explicit additive
        equivalence.
    - source: "Rectangular topological cokernel composition profile"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.rectangular_composition_profile"
      module: "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean"
      status: "proved"
      note: >-
        Under injectivity of the second rectangular matrix action, successive
        topological cokernel cardinalities multiply, finiteness is equivalent
        to finiteness of the composite, prime support is the union of the
        successive supports, and coprime exponents multiply exactly.
    - source: "Arbitrary-rank Smith classification of the topological cokernel"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.smith_cokernel_profile"
      module: "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean"
      status: "proved"
      note: >-
        The selected field gives the additive Smith equivalence, preserves
        `ZMod 0` free factors, characterizes finiteness by full target rank,
        and identifies exponent and prime support from the Smith moduli.
    - source: "Square determinant-index specialization"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.determinant_index_compatibility"
      module: "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean"
      status: "proved"
      note: >-
        For a nonsingular square matrix, the topological cokernel cardinality
        and the Smith-modulus product both equal the absolute determinant.
    - source: "Finite prime-power Smith refinement"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.prime_power_torsion_profile"
      module: "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean"
      status: "proved"
      note: >-
        When every Smith modulus is nonzero, the finite topological cokernel
        is explicitly equivalent to its product of prime-power cyclic factors,
        with the exact product cardinality formula.

