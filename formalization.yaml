fidelity:
  divergences: >-
    The selected certificate is a source-linked formalization contribution,
    not a claim of a new classical winding or Smith-normal-form theorem.  Its
    specifically identified independently-proved contribution is the exact
    relative-centrality criterion for equality of topological basepoint
    transports, packaged with the quotient-topology continuity boundary and
    the finite-torus winding/lattice profile.  The binary quotient-product
    theorem retains its explicit quotient-map hypothesis; no arbitrary
    indexed-product generalization is asserted.  The
    selected matrix/Smith scope is limited to the fields listed in
    `main_results`; broader matrix-map and arithmetic developments in the
    repository are intentionally treated as supporting results.  The parent
    computational-path source and Mathlib revision are pinned above, and the
    Challenge/Solution boundary is preserved for Comparator.

