# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Final and Ordinary Topologies for Computational Paths"
  description: >-
    A Lean formalization of topological semantics for endpoint-varying
    computational paths.  It constructs both the canonical final composable
    quotient and the ordinary pullback of quotient arrows.  The selected result
    proves that the canonical comparison is a continuous bijection and
    characterizes exactly when it is quotient, a homeomorphism, and an induced
    topology agreement; under these equivalent conditions ordinary composition
    is continuous.  It also records discontinuity as an obstruction and proves
    compact--Hausdorff and discrete sufficient cases.  The selected certificate
    additionally proves the genuine based-loop classifications of
    `AddCircle (1 : ℝ)` by `ℤ` and its product torus by `ℤ × ℤ`, using explicit
    covering-map lifts, winding invariance, additivity, and standard
    representatives.  It also formalizes the
    observable based fiber of the universal continuous-path presentation, its
    homeomorphism to the standard based loop quotient, the final/ordinary pair
    comparison, and the source-backed Hawaiian-earring transfer: the
    non-quotient square and discontinuous multiplication force failure of the
    scoped ordinary-pair quotient, topology agreement, and ordinary
    multiplication continuity under the comparison.
  authors:
    - "Arthur Freitas Ramos"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina Grisi de Oliveira"
    - "Tiago M. L. de Veras"
    - "David Barros Hulak"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.AT", "math.GN"]
  msc2020: ["22A22", "54B15", "03B38", "55Q05", "68V20", "54B30"]

sources:
  - title: "Topological Semantics for Scoped Computational Paths"
    authors:
      - "Arthur Freitas Ramos"
      - "Ruy J. G. B. de Queiroz"
      - "Anjolina Grisi de Oliveira"
      - "Tiago M. L. de Veras"
    type: "paper"
    id: "https://github.com/Arthur742Ramos/ComputationalPathsLean/blob/2a2baa1f31c68f0e696021db91f8381dd2854652/paper/topological/main.tex"
    location: "Sections 4, 8, and 10: final/ordinary topologies, circle/torus validation, and the Lean artifact"
    relationship: "adapts"
    note: >-
      The focused repository extracts and ports the manuscript's
      quotient-compatible topological groupoid and final/ordinary comparison
      sections, the circle and torus winding validation cases, the focused
      observable based-fiber construction, and its Hawaiian-earring
      obstruction-transfer argument.  The source is pinned to the immutable
      parent commit recorded in related_formalizations.
  - title: "Multiplication Is Discontinuous in the Hawaiian Earring Group (with the Quotient Topology)"
    authors:
      - "Paul Fabel"
    type: "paper"
    id: "https://doi.org/10.4064/ba59-1-9"
    location: "The non-quotient square and multiplication of the loop quotient"
    relationship: "background"
    note: >-
      Fabel's non-quotient square and discontinuous multiplication are
      supplied as explicit hypotheses; this repository formally checks their
      transfer to the scoped final-versus-ordinary comparison and does not
      reprove Fabel's theorems.

related_formalizations:
  - id: "https://github.com/Arthur742Ramos/ComputationalPathsLean/commit/2a2baa1f31c68f0e696021db91f8381dd2854652"
    relationship: "adapts"
    note: >-
      The focused repository extracts the audited topological-semantics source
      boundary at the topological-paper-v12 snapshot and ports it to Lean
      4.32.0.  The parent repository remains the broader development tree.

status:
  scope: >-
    The package formalizes the scoped geometric rewrite quotient and selects
    the exact comparison between its final and ordinary composable domains:
    quotient-map, homeomorphism, induced-topology, continuity-transfer, and
    obstruction statements, together with compact--Hausdorff and discrete
    sufficient conditions.  The unconditional final-domain groupoid laws are
    supporting infrastructure.  The selected certificate also contains the
    genuine additive-circle winding classification and coordinatewise
    product-torus classification, proved by explicit covering-map lifting and
    standard representatives.  It additionally contains the source-backed
    Hawaiian-earring obstruction
    observable based-fiber quotient comparison and source-backed transfer,
    including transferred multiplication discontinuity; Fabel's external
    theorems remain explicit inputs.  The
    Challenge file contains the one deliberate statement-side sorry allowed by
    the Palomar protocol; the proof development and Solution contain none.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "TopologicalComputationalPaths.main_result"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "manual"
      tool_setup: >-
        Human mathematical design, scope selection, source-lineage, attribution,
        and final metadata review.
    - method: "agent"
      models: ["Codex"]
      framework: "Lean 4.32.0 and Lake"
      tool_setup: >-
        AI-assisted extraction, compatibility repair, and proof review; every
        submitted theorem is checked by the Lean kernel.
      cost:
        wall_time: "multi-session local development"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Focused extraction, dependency audit, and Palomar packaging."
  spend_usd: "not tracked"
  notes: >-
    The focused repository was extracted from a pinned parent snapshot, ported
    to the supported toolchain, and checked with targeted and full Lake builds.

fidelity:
  divergences: >-
    The mathematical scope is unchanged for the extracted topological groupoid
    layer, but the focused repository adds a statement-facing Palomar
    certificate that selects the exact final-domain/ordinary-domain comparison,
    including its homeomorphism and ordinary-composition consequences, its
    positive sufficient cases, the genuine additive-circle and product-torus
    winding classifications from explicit covering lifts, the observable
    based-fiber quotient comparison, and the transfer of the Hawaiian-earring
    obstruction.  The circle and torus classifications are classical
    validation theorems rather than novelty claims.  The external
    non-quotient theorem is a stated hypothesis, not reproved by this
    repository.  The toolchain is ported from
    Lean 4.24.0 to Lean 4.32.0.  The other manuscript modules are omitted from
    this release rather than implied by the package.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Source lineage, dependency closure, theorem boundaries, quotient-map
    hypotheses, and the final-versus-ordinary topology distinction were
    audited.  Following earlier Palomar feedback, the selected declaration was
    changed from the automatic final-domain groupoid certificate to the
    substantive final-versus-ordinary comparison theorem, with unconditional
    genuine circle/torus full additive-classification certificates as its
    non-transport mathematical core.  These certificates expose identity,
    composition additivity, explicit standard representatives, and inverse
    laws, not merely equivalence witnesses.  The observable based-fiber construction and
    source-backed Hawaiian-earring obstruction transfer remain conditional
    secondary material.  Kernel builds and the Palomar-shaped
    Challenge/Solution boundary were checked locally; no independent peer
    review, approval, or endorsement is claimed.  Any Palomar editorial step
    is an automated review identifying no blocking problem, not mathematical
    approval.

alignment:
  namespace: "ComputationalPaths.Path.GeometricTopology.ScopedGeometricRewrite"
  statements:
    - source: "Unconditional quotient-compatible topological groupoid certificate"
      lean: "ComputationalPaths.Path.GeometricTopology.ScopedGeometricRewrite.scopedFinalTopologicalGroupoidCertificate"
      module: "ComputationalPaths/Path/Topology/ScopedGeometricRewriteGroupoid.lean"
      status: "proved"
      note: "Continuity and groupoid laws on the canonical final composable domain."
    - source: "Exact final/ordinary composable-domain comparison"
      lean: "ComputationalPaths.Path.GeometricTopology.ScopedGeometricRewrite.scopedProductCompatibility_iff_four_way"
      module: "ComputationalPaths/Path/Topology/ScopedGeometricRewriteGroupoid.lean"
      status: "proved"
      note: "This theorem and its compact--Hausdorff and discrete consequences are the core of the selected comparison certificate."
    - source: "Ordinary/final computational-path topology comparison certificate"
      lean: "TopologicalComputationalPaths.main_result"
      module: "Challenge.lean and Solution.lean"
      status: "adapted"
      note: >-
        The compared theorem packages continuous bijectivity, exact
        quotient-map, homeomorphism, and induced-topology criteria, continuity
        of ordinary composition, its obstruction, compact--Hausdorff and
        discrete sufficient cases, the genuine circle and product-torus
        winding classifications, the observable based-fiber quotient
        comparison, the full additive circle and product-torus classification
        certificates, and the source-backed transfer of a Hawaiian-earring
        non-quotient and discontinuous-multiplication obstruction.  The
        external Hawaiian-earring theorems are not claimed as reproved here.
    - source: "Genuine additive-circle winding classification"
      lean: "ComputationalPaths.Path.GeometricTopology.ConcreteCircleWinding.topologicalLoopQuotEquivInt"
      module: "ComputationalPaths/Path/Topology/ConcreteCircleWinding.lean"
      status: "proved"
      note: "The selected certificate exposes the lifted-endpoint invariant, identity value, composition additivity, explicit standard representatives, and both inverse laws for based continuous loops in AddCircle (1 : ℝ) modulo endpoint-fixed homotopy."
    - source: "Genuine product-torus winding classification"
      lean: "ComputationalPaths.Path.GeometricTopology.TopologicalTorus.equivIntProd"
      module: "ComputationalPaths/Path/Topology/ConcreteTorusWinding.lean"
      status: "proved"
      note: "The selected certificate exposes the coordinatewise invariant, identity value, composition additivity, explicit standard representatives, and both inverse laws for based continuous loops in the product of two additive circles."

acknowledgements: >-
  Thanks to the authors and contributors of the Calculus of Computational Paths,
  Lean 4, Mathlib, and the Palomar Registry tooling.
