automation:
  methods:
    - method: "manual"
      tool_setup: >-
        Human mathematical scope selection, literature/provenance audit,
        attribution, and final metadata review.
    - method: "agent"
      models: ["Codex"]
      framework: "Lean 4.32.0 and Lake"
      tool_setup: >-
        AI-assisted API audit, proof review, documentation, and compatibility
        repair; every selected theorem is checked by the Lean kernel.
      cost:
        wall_time: "multi-session local development"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        Align the follow-up declaration, source lineage, and submission
        metadata; preserve exact theorem boundaries.
  spend_usd: "not tracked"
  notes: >-
    Verification uses the ordinary Lake build, the repository quality gates,
    and a fresh Palomar Comparator replay with NanoDa and Lean's default
    kernel.

fidelity:
  divergences: >-
    The selected certificate is a repository-level formalization synthesis,
    not a claim of a new classical winding or Smith-normal-form theorem.  The
    binary quotient-product theorem retains its explicit quotient-map
    hypothesis; no arbitrary indexed-product generalization is asserted.  The
    selected matrix/Smith scope is limited to the fields listed in
    `main_results`; broader matrix-map and arithmetic developments in the
    repository are intentionally treated as supporting results.  The parent
    computational-path source and Mathlib revision are pinned above, and the
    Challenge/Solution boundary is preserved for Comparator.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The selected declaration was audited field-by-field against the title,
    description, status scope, alignment, source relationships, and excluded
    repository results.  The cited literature supplies context and known
    mathematical relationships; the original-proof entry records only the
    exact bundled formal certificate.  Builds and Comparator replay are
    technical verification, not independent peer review or novelty approval.

