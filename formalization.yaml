fidelity:
  divergences: >-
    The selected theorem is a bundled certificate, not a claim that winding,
    fundamental groups, or Smith normal form were newly discovered.  The
    concrete_winding_word_bridge is a fixed list language: trace length is
    List.length, realization is concatenation of actual standard torus loops,
    representation is proved against the winding standard representative, and
    matrix naturality is stated for the induced topological map.  The
    shortest-trace conclusion is therefore derived for this syntax: zero
    winding has a zero-length word and nonzero winding has a one-letter word,
    with the lower bound proved from the homotopy/winding theorem.  Smith
    image tests are stated for actual quotient maps and for geometric word
    representatives.  Finite cardinality and prime-support statements are
    gated by finite-cokernel hypotheses; ZMod 0 records free factors.
    Classical ingredient results and repository-only APIs outside this
    declaration are not attributed to the selected theorem.

