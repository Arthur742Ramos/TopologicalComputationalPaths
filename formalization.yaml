version: "v0.4"

project:
  name: "Topological Smith Image Obstructions and Cokernel Composition for Finite-Torus Quotient Maps"
  description: >-
    This follow-up selects
    `TopologicalComputationalPathsFollowup.topological_smith_exactness`.
    It is a kernel-checked certificate with six top-level fields.  The first
    field is a coherent family of complete winding classifiers: each classifier agrees
    with the explicit winding invariant on every loop representative,
    identifies quotient concatenation with addition in the integer lattice
    through a continuous equivalence into the multiplicative lattice model,
    and intertwines the induced integer-matrix map on finite-torus loop
    quotients with the matrix action on winding vectors.  It also proves exact
    image, injectivity, and surjectivity transfer for those quotient maps,
    including the square determinant criteria.  It also decides image
    membership for the induced quotient map by finite Smith-coordinate
    divisibility tests, including the zero-factor constraints in rank-deficient
    cases.  The remaining fields state
    canonical matrix composition and exact rectangular lattice-cokernel
    profiles: finite-cokernel cardinality products, finiteness equivalences,
    finite-cokernel prime support, and coprime exponent composition;
    arbitrary-rank Smith factors including `ZMod 0` free directions; the
    nonsingular square determinant index; and a finite prime-power refinement.
    The certificate deliberately restricts cardinality and prime-support
    conclusions to finite cokernels.  A zero Smith factor is instead an
    explicit `ZMod 0` free direction; in that case Mathlib's totalized
    `Nat.card = 0` and exponent-zero conventions are recorded, not ordinary
    finite cardinality or torsion-prime support.  The selected declaration
    therefore records a precise topology-to-arithmetic bridge.  Its selected
    nested bridge is instantiated by the universal traced computational-path
    presentation: trace length is preserved by identity, composition, and
    reversal, every continuous loop has a geometric representative, and the
    same Smith image test applies to that representative's winding class.  Two
    explicit compatibility fields identify the bridge's winding and quotient
    classifier with the selected certificate's own fields.
    Short-exact torus-map wrappers,
    first-isomorphism packaging, indexed products, centrality, CRT, and other
    matrix APIs remain repository support and are not selected claims.
  authors:
    - "Arthur Freitas Ramos"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina Grisi de Oliveira"
    - "Tiago M. L. de Veras"
    - "David Barros Hulak"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

