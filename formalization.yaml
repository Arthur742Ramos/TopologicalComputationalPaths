    authors:
      - "Jack S. Calcut"
      - "John D. McCarthy"
    type: "paper"
    id: "https://arxiv.org/abs/0904.4739"
    location: "Homogeneity and discreteness of quotient-topological fundamental groups"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      This is substantive literature context for the homogeneity and
      null-class/discreteness boundary.  The selected Lean fields give a
      self-contained formal development of the stated boundary and its
      homotopy/basepoint invariances; they do not claim to reproduce every
      theorem in the paper.
  - title: "On Fundamental Groups with the Quotient Topology"
    authors:
      - "Jeremy Brazas"
      - "Paul Fabel"
    type: "paper"
    id: "https://arxiv.org/abs/1304.6453"
    location: "Quasitopological fundamental groups and the joint-continuity boundary"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      This source supplies the established quotient-topology and
      quasitopological-group context for the general structure, including why
      separate continuity does not by itself give a topological group.
  - title: "Algebraic Topology"
    authors:
      - "Allen Hatcher"
    type: "book"
    id: "https://pi.math.cornell.edu/~hatcher/AT/AT.pdf"
    location: "Chapter 1: the circle, winding, and products"
    relationship: "background"
    author_endorsement: "n/a"
    note: >-
      The finite-torus winding classification is classical algebraic topology.
      The selected artifact supplies explicit Lean winding representatives,
      compact-open/quotient-topological statements, coordinate naturality,
      and all-basepoint forms; it does not claim the classical classification
      as a new mathematical theorem.
  - title: "Finitely Generated Abelian Groups and Similarity of Matrices over a Field"
    authors:
      - "Christopher Norman"
    type: "book"
    id: "https://doi.org/10.1007/978-1-4471-2730-7"
    location: "Matrices with Integer Entries: the Smith Normal Form; invariant factors"
    relationship: "background"
    author_endorsement: "n/a"
    note: >-
      This is the substantive algebra reference for the Smith-factor and
      invariant-factor language used by the selected matrix-cokernel fields.
      The Lean certificate formalizes the explicitly listed exponent and
      p-adic consequences in its own quotient presentation.
  - title: "Functorial quotient fundamental groups and finite-torus cokernel profiles: selected follow-up certificate"
    authors:
      - "Arthur Freitas Ramos"
      - "Ruy J. G. B. de Queiroz"
      - "Anjolina Grisi de Oliveira"
      - "Tiago M. L. de Veras"
      - "David Barros Hulak"
    type: "original-proof"
    id: "https://github.com/Arthur742Ramos/TopologicalComputationalPaths"
    location: "FollowupChallenge.lean and FollowupSolution.lean"
    relationship: "other"
    author_endorsement: "participated"
    note: >-
      This entry records the exact bundled formal certificate as an original
      repository-level presentation.  It is not a claim that the classical
      winding, Smith-normal-form, or quotient-topology ingredients are novel;
      those relationships and their literature context are recorded above.

