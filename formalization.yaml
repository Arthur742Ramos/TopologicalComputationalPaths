status:
  scope: >-
    The selected declaration is exactly
    `TopologicalComputationalPathsFollowup.topological_smith_exactness` in
    `FollowupSolution.lean`.  It asserts a nonempty
    `TopologicalSmithExactnessCertificate` over the actual finite-torus
    quotient fundamental groups.  Its seven selected fields are (i) the
    explicit quotient-to-winding homeomorphism; (ii) the rectangular
    winding-compatible short-exact sequence for composable integer matrices,
    including the topological/lattice comparison maps; (iii) the associated
    square first-isomorphism quotient; (iv) the rectangular composition profile
    for cardinality, finiteness, exponent, and prime support; (v) the
    arbitrary-rank Smith additive equivalence, finite iff full target rank,
    exponent-lcm identity, and prime-support identity; (vi) square determinant
    cardinality and Smith-product compatibility; and (vii) the finite
    prime-power refinement with its exact cardinality product.
    Free directions are represented explicitly by `ZMod 0`; no hidden
    full-rank assumption is made in the rectangular profile.  The older
    centrality, binary product, finite-torus classifier, and repository-wide
    matrix declarations remain supporting results outside the selected
    certificate.  The Challenge has one deliberate statement-side `sorry`;
    the selected Solution and imported development have none.
