status:
  scope: >-
    The selected declaration is exactly
    `TopologicalComputationalPathsFollowup.main_result` in
    `FollowupSolution.lean`: a nonempty general
    `QuotientTopologicalFundamentalGroupTheory` and, for every finite `n`, a
    nonempty `FiniteTorusTopologicalClassification n`.  The general structure
    includes functoriality, homotopy/homeomorphism/basepoint invariance, T1 and
    discreteness criteria, semilocal and covering consequences, and a binary
    product-preservation theorem conditional on the product quotient map.  It
    has no arbitrary-indexed-product field.  The finite-torus structure
    includes winding, standard representatives, coordinate naturality,
    continuous multiplicative classifiers, arbitrary-basepoint/path
    independence, commutativity, discreteness, openness, and semilocal
    simple connectivity.  Its selected matrix fields are the two short-exact
    cokernel statements; lcm, coprime-product, determinant-coprime, and
    prime-support exponent laws; the Smith-factor lcm and prime-support laws;
    and the Smith-factor and class-order p-adic factorization profiles.  The
    repository's broader matrix-map/cardinality/CRT/free-factor/annihilator
    results remain supporting material outside this selected certificate.
    The Challenge file has one deliberate statement-side sorry; the selected
    Solution and substantive development have none.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "TopologicalComputationalPathsFollowup.main_result"
      file: "FollowupSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-followup.json"
      selected_fields:
        - "QuotientTopologicalFundamentalGroupTheory.quotient_product_preserved"
        - "QuotientTopologicalFundamentalGroupTheory.quotient_product_hypothesis_sharp"
        - "FiniteTorusTopologicalClassification.winding"
        - "FiniteTorusTopologicalClassification.standardLoop"
        - "FiniteTorusTopologicalClassification.classifier"
        - "FiniteTorusTopologicalClassification.classifier_coordinate_projection"
        - "FiniteTorusTopologicalClassification.classifier_continuous_mul_equiv"
        - "FiniteTorusTopologicalClassification.classifier_continuous_mul_equiv_at"
        - "FiniteTorusTopologicalClassification.classifier_continuous_mul_equiv_at_path_independent"
        - "FiniteTorusTopologicalClassification.quotient_mul_commutative_at"
        - "FiniteTorusTopologicalClassification.quotient_discrete_at"
        - "FiniteTorusTopologicalClassification.semilocally_simply_connected"
        - "FiniteTorusTopologicalClassification.matrix_cokernel_short_exact"
        - "FiniteTorusTopologicalClassification.matrix_cokernel_rectangular_short_exact"
        - "FiniteTorusTopologicalClassification.matrix_cokernel_exponent_lcm_dvd"
        - "FiniteTorusTopologicalClassification.matrix_cokernel_rectangular_exponent_lcm_dvd"
        - "FiniteTorusTopologicalClassification.matrix_cokernel_exponent_eq_mul_of_coprime"
        - "FiniteTorusTopologicalClassification.matrix_cokernel_rectangular_exponent_eq_mul_of_coprime"
        - "FiniteTorusTopologicalClassification.matrix_cokernel_exponent_eq_mul_of_det_coprime"
        - "FiniteTorusTopologicalClassification.matrix_cokernel_exponent_prime_dvd_iff"
        - "FiniteTorusTopologicalClassification.matrix_cokernel_rectangular_exponent_prime_dvd_iff"
        - "FiniteTorusTopologicalClassification.matrix_cokernel_exponent_prime_dvd_iff_of_det_ne_zero"
        - "FiniteTorusTopologicalClassification.matrix_cokernel_exponent_eq_smithFactorLcm"
        - "FiniteTorusTopologicalClassification.matrix_cokernel_exponent_factorization_eq_smithFactor_sup"
