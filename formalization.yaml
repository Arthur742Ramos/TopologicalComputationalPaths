status:
  scope: >-
    The selected declaration is exactly
    `TopologicalComputationalPathsFollowup.topological_smith_exactness` in
    `FollowupSolution.lean`.  It asserts a nonempty
    `TopologicalSmithExactnessCertificate`.  Its six fields are: (i) a
    coherent family of winding classifiers for the based loop quotient of
    every finite torus, including representative, group-law, induced
    matrix-map naturality, exact image/injectivity/surjectivity transfer, and
    matrix-map composition equations; (ii) the
    canonical matrix-composition identity; (iii) the
    rectangular lattice-cokernel profile under injectivity of the second map,
    giving finite-cokernel cardinality products, finiteness equivalence,
    finite-cokernel prime-support, and coprime-exponent laws; (iv) the
    arbitrary-rank Smith additive equivalence, finite iff full target rank,
    and exponent-lcm identity, with its prime-support identity likewise
    gated by finiteness; (v) the nonsingular square determinant-index formula;
    and (vi) the finite prime-power refinement with its exact cardinality
    product.  The
    lattice-cokernel fields concern the integer winding lattice; the first
    field additionally connects that lattice action to actual induced maps of
    finite-torus loop quotients.  The declaration does not state short-exact
    or first-isomorphism wrappers for torus maps.
    Free directions are represented explicitly by `ZMod 0`; their totalized
    `Nat.card = 0` and exponent-zero behavior is not presented as ordinary
    finite cardinality or torsion-prime support.  Centrality,
    binary/indexed products, broader matrix APIs, and other quotient-topology
    declarations remain repository support outside this Comparator target.
    The Challenge has one deliberate statement-side `sorry`; the selected
    Solution and imported development have none.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "TopologicalComputationalPathsFollowup.topological_smith_exactness"
      file: "FollowupSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
