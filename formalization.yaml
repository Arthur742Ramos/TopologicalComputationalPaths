        - "unselected CRT, annihilator, and broader matrix families"

research_interest:
  audience: >-
    Researchers in algebraic topology, general topology, certified
    computational algebra, and formalized mathematics.
  selected_contribution: >-
    TopologicalComputationalPathsFollowup.topological_smith_exactness is a
    concrete, all-dimensional bridge from topology to arithmetic.  Its
    monodromy-stabilizer and product boundary frame the finite-torus result.
    It identifies induced maps of finite-torus quotient
    fundamental groups with integer matrix actions, decides their images by
    Smith divisibility (including rank-deficient zero-factor equations), and
    simultaneously gives an explicit winding-word syntax.  A word is a finite
    list of winding generators, its geometric meaning is an actual
    concatenation of standard loops, its cost is derived List.length, and its
    canonical zero/one normal form is proved rather than supplied as a field.
    The same word semantics is natural under every rectangular integer matrix
    and admits a source-loop Smith realizability equivalence.
  why_nontrivial: >-
    The mathematical synthesis is the compatibility theorem between three
    independently typed layers: quotient fundamental-group topology, concrete
    winding-word reduction, and rectangular Smith arithmetic.  The selected
    statement quantifies over every finite dimension and every rectangular
    matrix, proves the topological image iff the Smith divisibility equations,
    and isolates free directions instead of silently applying finite formulas
    to infinite cokernels.  This is a reusable certified decision interface
    with explicit normal-form complexity, not an existence claim for an
    arbitrary homeomorphism.
  paper_worthiness: >-
    This is plausibly a serious formalization note or methods note for a
    specialist audience because it supplies a precise, independently replayable
    interface between quotient fundamental groups and certified integer-linear
    computation.  The contribution is not the classical winding or Smith
    theorem in isolation: it is the uniform rectangular matrix-map image
    equivalence, together with a concrete word language whose realization,
    matrix naturality, and optimal zero/one representatives are all kernel
    checked.  The finite/free boundary is explicit and testable, making the
    certificate suitable as a reusable benchmark for formal topological
    algebra.  Novelty and priority of the mathematical synthesis are recorded
    as unknown pending specialist comparison.
  literature_boundary: >-
    Hatcher and Norman are ingredient-only background; Brazas--Fabel and
    Calcut--McCarthy provide quotient-topology context; the parent
    computational-path manuscript supplies surrounding vocabulary.  The
    concrete winding-word/Smith synthesis is recorded as an original-proof
    provenance entry with priority unknown.  No local Lean file is treated as
    an external mathematical source, and no first-discovery claim is made for
    classical ingredients.
  evidence:
    - "FollowupChallenge.lean: TopologicalSmithExactnessCertificate.covering_map_image_is_monodromy_stabilizer"
    - "FollowupChallenge.lean: TopologicalSmithExactnessCertificate.quotient_product_hypothesis_sharp"
    - "FollowupChallenge.lean: TopologicalSmithExactnessCertificate.rectangular_cokernel_short_exact"
    - "FollowupChallenge.lean: TopologicalSmithExactnessCertificate.winding_matrix_compatibility"
    - "FollowupChallenge.lean: FiniteTorusWindingMatrixCompatibility.matrix_map_smith_image_iff"
    - "FollowupChallenge.lean: FiniteTorusWindingMatrixCompatibility.concrete_winding_word_bridge"
    - "FollowupChallenge.lean: FollowupChallenge.WindingWord.traceLength"
    - "FollowupChallenge.lean: FollowupChallenge.WindingWord.realize"
    - "FollowupChallenge.lean: TopologicalComputationalPathsFollowup.topological_smith_exactness"

