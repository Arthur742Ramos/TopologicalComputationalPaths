      status: "proved"
      note: "A reusable additive first-isomorphism package proves the cokernel short-exact sequence for arbitrary composable homomorphisms when the second map is injective, and specializes to rectangular integer matrices and their finite-torus quotient maps in all composable dimensions. Composite ranges are also identified with the canonical matrixCompose ranges, with direct exact-sequence and injectivity-criterion interfaces. The winding equivalence gives explicit rectangular cokernel equivalences and proved naturality for both the composite embedding and complementary projection, including named square matrixCompose maps. A single rectangular certificate packages both exact sequences and commuting squares."

