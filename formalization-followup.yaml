research_interest:
  audience: "Researchers in algebraic topology, general topology, formalized mathematics, and computational homotopy"
  selected_contribution: >-
    The selected paper-sized theorem is the exact iff
    `quotient_basepoint_change_relative_comm_iff`: for arbitrary pointed
    spaces, equality of the two continuous multiplicative transports induced
    by paths with common endpoints is equivalent to centrality of their
    relative loop in the target quotient fundamental group.  It is coupled to
    homotopy/basepoint invariance, the sharp binary product-quotient boundary,
    and the all-basepoint finite-torus winding/Smith profile.
  why_nontrivial: >-
    This is a quantified topology--algebra coherence result, not a restatement
    of an isolated group isomorphism.  It controls path-choice dependence of
    the actual quotient-topological transport maps, identifies the precise
    obstruction to canonical transport in the nonabelian case, and then
    specializes the mechanism to a uniform family of finite tori with exact
    coordinate and p-adic profile fields.
  literature_boundary: >-
    Calcut--McCarthy and Brazas--Fabel are the substantive sources for the
    quotient-topology, homogeneity, discreteness, and continuity boundaries;
    Hatcher supplies the classical winding context; Norman supplies the Smith
    invariant-factor context; and the pinned parent manuscript supplies the
    computational-path setting.  The metadata records these relationships as
    formalizes/adapts.  No first-publication claim is made for the classical
    ingredients.  The originality claim is limited to this explicit,
    source-linked formalized coherence synthesis and its exact theorem
    interface, which the cited sources do not present in this combined form.
  evidence:
    - "FollowupChallenge.lean: QuotientTopologicalFundamentalGroupTheory.quotient_basepoint_change_relative_comm_iff"
    - "FollowupChallenge.lean: QuotientTopologicalFundamentalGroupTheory.quotient_product_hypothesis_sharp"
    - "FollowupChallenge.lean: FiniteTorusTopologicalClassification.classifier_continuous_mul_equiv_at_path_independent"
    - "FollowupChallenge.lean: FiniteTorusTopologicalClassification.matrix_cokernel_exponent_factorization_eq_smithFactor_sup"

