status:
  scope: >-
    The selected theorem packages a universe-polymorphic theory for arbitrary
    pointed spaces together with the complete finite-torus family.  The
    general portion proves functoriality under continuous maps, coherence with
    identity and composition, homotopy-equivalence invariance, path-based
    basepoint change, path-homotopy coherence, identity, composition, and
    reversal coherence, continuous-map naturality, basepoint joint-continuity
    invariance, the pointed fixed-basepoint homotopy corollary, the
    path-connected all-basepoints joint-continuity and discreteness criteria,
    the homotopy-invariant global continuity criterion, and
    the one-basepoint semilocal criterion in the locally path-connected,
    path-connected setting, the homotopy- and path-invariant T1 separation
    boundary, and conditional indexed-product preservation.  It also
    proves continuous reversal, separate continuity, homogeneity, exact T1
    and discreteness criteria, product sharpness, the semilocal
    discreteness equivalence and homotopy invariance in locally path-connected
    spaces, and homotopy invariance of the joint-continuity boundary,
    covering/monodromy consequences, and the topological-group agreement
    boundary.
    The finite-torus portion proves explicit winding representatives,
    completeness, additivity, open classes, and the homeomorphism with the
    integer lattice.  It also proves a continuous multiplicative equivalence
    to `Multiplicative (Fin n → ℤ)` for the actual quotient group operation,
    hence abelianity at the zero basepoint and every transported basepoint.
    Basepoint transport then proves all-basepoint discreteness, a common
    lattice model, and semilocal simple connectivity for every finite torus.
    In the abelian target case it also proves that the lattice classifier built
    along any explicit basepoint path is independent of that path.  The more
    precise general statement is an iff: equality of transports is equivalent
    to centrality of the relative loop.
    Coordinate-selection maps act naturally on winding vectors and on the
    quotient classifier by reindexing, with the continuous multiplicative
    classifier obeying the same equation across dimensions.  Both the maps and
    their lattice reindexings have explicit identity and composition laws;
    standard representatives and the quotient decoder satisfy the
    corresponding equation.  The path-based classifier satisfies the same
    naturality square at arbitrary basepoints after mapping the chosen
    transport path.  The canonical classifier satisfies it as well, by
    abelian-target path independence.
    The lattice reindexings are also continuous additive morphisms with the
    corresponding identity and composition laws.
    For index equivalences, these are upgraded to a torus homeomorphism and a
    continuous additive lattice equivalence with the same coherence laws.
    The arbitrary-basepoint classifier squares are likewise restated through
    the continuous additive reindexing map.
    Surjective index maps yield injective torus, lattice, and quotient maps;
    injective index maps yield surjective maps by zero extension.
    For an arbitrary index map, the image is characterized exactly by
    fiber-constant target winding vectors, equivalently for typed quotient
    loop classes.  The corresponding converse injectivity/surjectivity
    criteria are proved as iff theorems.  Typed quotient coordinate maps are
    also contravariantly additive, with identity/composition coherence and an
    exact kernel description by vanishing on the index-map image; the
    resulting additive maps are continuous for the discrete quotient
    topologies.  Finally, arbitrary integer matrices define continuous torus
    maps whose continuous lattice actions, standard-loop representatives, and typed
    quotient maps satisfy matrix identity/composition laws, with exact image,
    kernel, injectivity, and surjectivity transfer and continuous additive
    quotient homomorphisms.
    The composition-cokernel short exact sequence is further equipped with
    explicit first-isomorphism quotient equivalences on both the lattice and
    topological quotient sides, together with their representative formulas.
    The exactness construction is abstracted to arbitrary composable additive
    homomorphisms and instantiated for rectangular integer matrices in all
    composable dimensions, with injectivity of the second action as the exact
    hypothesis; the same package is transported to the finite-torus quotient
    side.  The composite-image subgroups are also identified with the ranges
    of the canonical row-by-column `matrixCompose` maps, and the rectangular
    exact-sequence and injectivity-criterion interfaces are exposed in that
    notation on both sides.  The winding equivalence is lifted to explicit
    additive equivalences between every rectangular finite-torus cokernel and
    its lattice cokernel, and both the composite embedding and complementary
    projection are proved natural under those equivalences.  The named square
    `matrixCompose` maps expose the same naturality laws directly, and a
    rectangular diagram certificate packages both exact sequences and squares.
    The abstract map and projection expose simp-normalized representative
    formulas for downstream calculations.  Cardinality and finiteness are
    transported across the rectangular equivalence for matrices and composites
    without square-dimension or finiteness assumptions.
    The Comparator challenge has one deliberate statement hole; the solution
    and substantive development have none.
