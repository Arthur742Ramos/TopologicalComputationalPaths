version: "v0.4"

project:
  name: "Path-Choice Centrality and Finite-Torus Smith Profiles for Quotient Fundamental Groups"
  description: >-
    Companion metadata for the selected follow-up declaration
    `TopologicalComputationalPathsFollowup.main_result`.  The declaration is
    a conjunction of a general functorial quotient-topological fundamental-
    group theory and, for every finite `n`, a finite-torus certificate.  Its
    principal contribution is the exact relative-centrality iff: two
    continuous multiplicative basepoint transports agree exactly when their
    relative loop is central in the target quotient.  The general structure
    also proves induced-map, homotopy, homeomorphism, basepoint, T1,
    discreteness, semilocal, covering, and topological-group boundary results.
    Its product result is binary and conditional on the product of the two
    quotient projections being a quotient map; it does not assert arbitrary
    indexed-product preservation.  The finite-torus structure
    proves winding/standard-loop classification by `Fin n → ℤ`, coordinate
    naturality, continuous multiplicative and arbitrary-basepoint classifiers,
    path independence, commutativity, discreteness, openness, and semilocal
    simple connectivity.  Its selected algebraic layer consists exactly of
    the square/rectangular cokernel short-exact fields, lcm and coprime-product
    exponent fields, determinant-coprime and prime-support fields, and the
    named Smith-factor lcm, Smith-factor prime-support, exponent p-adic, and
    class-order p-adic fields.  Broader repository matrix-map, determinant
    cardinality, CRT, free-factor, annihilator, image, kernel, and
    injectivity/surjectivity declarations are supporting material and are not
    attributed to this selected certificate.  Winding and Smith ingredients
    are classical; the claimed research contribution is the source-linked,
    formally explicit topology--algebra coherence package, not a priority
    claim for those classical calculations.
  authors:
    - "Arthur Freitas Ramos"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina Grisi de Oliveira"
    - "Tiago M. L. de Veras"
    - "David Barros Hulak"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

