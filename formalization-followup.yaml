research_interest:
  audience: "Researchers in algebraic topology, general topology, computational algebra, and formalized mathematics"
  selected_contribution: >-
    `TopologicalComputationalPathsFollowup.topological_smith_exactness` is a
    three-layer certificate.  Its first layer proves, for every covering map, the
    exact image-equals-monodromy-stabilizer criterion for the induced quotient
    fundamental-group map.  Its second layer proves the sharp converse boundary
    for products: discontinuous quotient multiplication rules out the product
    quotient map.  Its third layer is a nine-top-level-field certificate connecting
    a finite-torus topological quotient with computable integer invariants.  Its
    third certificate field gives a rectangular winding-lattice cokernel short
    exact sequence and an explicit first-isomorphism quotient.  Its fourth
    certificate field is an all-dimensional family of
    explicit winding classifiers: representatives, quotient multiplication,
    and induced integer-matrix maps are tied together by stated equations;
    exact image, injectivity, and surjectivity transfer is also proved, with
    determinant criteria in the square case.  Crucially, the same selected
    classifier turns image membership for every induced quotient map into
    finite Smith-coordinate divisibility tests, including zero-factor
    constraints when rank is deficient.  The selected nested abstract-trace
    bridge supplies a quantified raw family, trace-length algebra, geometric
    based-loop coherence, a section covering every continuous loop, and a
    homotopy-class quotient equivalent to the ordinary loop quotient.  Two
    compatibility equalities identify its winding and quotient classifier with
    the selected outer classifier.  Its winding-indexed one-step normal form
    has a proved trace-length and homotopy-completeness law.  More precisely,
    its minimum trace length is zero exactly for zero winding and one
    otherwise, and the standard representatives are natural under matrix maps
    up to endpoint-fixed homotopy; matrix-map composition is coherent on every
    traced loop (the fields are
    `trace_zero_winding_zero`, `minimal_trace_normal_form`,
    `matrix_normal_form_naturality`, and
    `matrix_map_composition_homotopy`, plus `normal_form_trans`,
    `normal_form_unit`, and `matrix_normal_form_minimal`).  The remaining
    The selected rectangular exactness field supplies an injective cokernel
    embedding, a surjective projection with exactly that image as kernel, and
    the corresponding first-isomorphism quotient for every composable pair with
    injective second action.  The remaining fields record matrix composition
    and exact rectangular lattice-cokernel laws for finite-cokernel cardinality,
    finiteness, finite
    prime support, and coprime exponents.  Its Smith profile handles arbitrary
    rank, including `ZMod 0` free factors; cardinality and prime-support
    interpretations are asserted only in the finite regime, while the
    arbitrary-rank exponent uses the explicit zero convention for free
    factors.  Its finite refinement exposes prime-power cyclic factors.  At the
    path level, a target traced loop is homotopic to the mapped geometric loop
    of some source loop exactly when its winding coordinates satisfy the Smith
    divisibility equations.  The
    determinant-index identity is the nonsingular square specialization.  The selected statement does not include the repository's
    separate topological torus-map short-exact or first-isomorphism wrappers.
  why_nontrivial: >-
    The content is a quantified bridge rather than a single determinant
    calculation: the actual winding invariant, quotient multiplication, and
    induced matrix maps are identified with one lattice model; image,
    injectivity, and surjectivity of the topological maps are characterized by
    the corresponding lattice action, and one certificate simultaneously covers all finite dimensions and all
    rectangular ranks.  The two preceding general topological fields are
    substantive scope: they identify the exact subgroup realized by a covering
    map through monodromy and prove a necessary obstruction for product
    quotient constructions.  Together they place the finite-torus arithmetic
    certificate inside the general quotient-fundamental-group framework rather
    than presenting an isolated lattice calculation.  The Smith-coordinate image criterion is a concrete
    topological consequence: it decides whether a prescribed quotient loop
    class is realizable by the induced matrix map using finitely many integer
    divisibility checks, even in rank-deficient cases.  The composition profile separates finite torsion from
    `ZMod 0` free directions: its cardinality and prime-support conclusions
    are explicitly finite-cokernel statements, while exponent identities use
    the stated totalized zero convention in free cases.  The Smith and
    prime-power fields make the invariants usable for computation, while
    the determinant formula is isolated to the square nonzero-determinant
    case.  The abstract traced presentation adds a semantic layer at the
    statement boundary: its quantified raw family preserves trace-length
    algebra and geometric based-loop coherence, while its section covers every
    continuous loop before the Smith obstruction is applied.  Its homotopy
    quotient is explicitly equivalent to the ordinary based loop quotient, so
    the arithmetic class is tied to the declared abstract presentation.  The
    canonical one-step representatives provide a normal-form operation on
    traced loops, with homotopy completeness proved in the certificate.  The
    certificate also proves the exact lower bound: zero winding is precisely
    the zero-step case, while nonzero winding forces every homotopic trace to
    have at least one step.  The normal form is natural under every integer
    matrix map, and path-map composition agrees up to endpoint-fixed homotopy.
    The standard trace for `z + w` is homotopic to the concatenation of the
    standard traces for `z` and `w`, and the zero-winding standard trace is
    homotopic to the traced identity.  The path-level Smith realizability
    theorem gives a complete decision interface for this abstract traced
    presentation, rather than only for quotient classes.  The repository's
    concrete endpoint-varying `ComputationalPaths.Path` constructions remain
    supporting material and are not asserted by the selected declaration.
  paper_worthiness: >-
    The selected theorem is a compact, auditable formal synthesis with two
    general topological consequences and a finite-torus application.  For every
    covering map it identifies the image subgroup of the induced quotient
    fundamental-group map with the monodromy stabilizer, and it proves that
    discontinuous quotient multiplication prevents the product of quotient
    projections from being a quotient map.  The selected exactness field also
    gives a short exact sequence of rectangular winding-lattice cokernels and
    an explicit first-isomorphism quotient whenever the second action is
    injective.  On the finite torus it then gives a
    substantive topological consequence: a genuine
    quotient-topological fundamental group is reduced to its explicit winding
    lattice, quotient multiplication is certified as lattice addition, and
    maps induced by arbitrary integer matrices commute with that classifier;
    their image, injectivity, and surjectivity are characterized exactly, and
    the image of every induced quotient map is decided directly in Smith
    coordinates.  This makes the arithmetic obstruction a theorem about
    actual quotient fundamental-group maps, not merely a lattice-side
    decomposition.
    The same declaration supplies arbitrary-rank composition, Smith,
    determinant-index, and prime-power invariants.  The exact finite/free
    boundary applies uniformly to rectangular maps; prime support and
    ordinary cardinality are asserted only after the relevant finiteness
    hypotheses, while free cases retain explicit `ZMod 0`, `Nat.card = 0`,
    and exponent-zero conventions.  The square determinant identity supplies
    a sharp finite specialization.
    The abstract traced interface closes the statement-level scope gap: the
    advertised arithmetic obstruction is attached to a declared traced family
    and its geometric loop semantics, not merely to an arbitrary
    homeomorphism.  The winding-indexed one-step normal form is a reusable
    method for reducing representatives in that abstract presentation before
    applying the Smith obstruction.
    It is a shortest-trace theorem rather than an existence-only statement:
    the certificate identifies the exact minimum cost of every homotopy class
    (zero for zero winding, one otherwise), proves the nonzero lower bound, and
    shows that matrix transformations preserve the chosen normal forms up to
    homotopy, compose coherently, respect winding addition, and preserve the
    traced identity.  This gives a reusable normalization
    semantics for computational-path transformations.
    For a nonzero matrix-action winding, the same certificate proves that the
    mapped canonical trace admits a one-step target normal form and that no
    homotopic target trace can use zero steps.  Thus matrix image membership is
    coupled to an optimal path-level realization, not just to existence of a
    quotient class.
    The new path-level realizability equivalence makes that obstruction
    constructive at the semantic boundary: it decides whether a prescribed
    traced target can be obtained, up to geometric homotopy, from a source loop
    by a matrix map.  This is a consequence about the declared abstract traced
    presentation, not a restatement about bare quotient elements.  This makes
    the certificate a reusable note-sized interface between algebraic topology
    and computational abelian-group calculations: the classical lattice
    calculations become a certified decision and reduction method on an
    explicit trace interface.  The classical ingredients and their sources are
    listed explicitly; the bounded provenance record is only for the exact
    bundle documented in `FIRST-PRESENTATION-AUDIT.md`, and makes no priority
    claim.
  literature_boundary: >-
    Hatcher and Norman provide ingredient-only winding and Smith/invariant-
    factor background, while Brazas--Fabel and Calcut--McCarthy provide the
    quotient-topological context.  The parent computational-path manuscript
