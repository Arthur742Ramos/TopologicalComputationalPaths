sources:
  - title: "Discreteness and Homogeneity of the Topological Fundamental Group"
    authors:
      - "Jack S. Calcut"
      - "John D. McCarthy"
    type: "paper"
    id: "https://arxiv.org/abs/0904.4739"
    location: "Homogeneity and discreteness of the quotient-topological fundamental group"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The Lean development independently constructs translation
      homeomorphisms and proves the exact null-class-openness criterion.  It
      formalizes both directions of the discreteness/semilocal connection:
      discreteness implies the pointwise semilocal condition in general, and
      the converse is proved for locally path-connected spaces by a finite
      compact-open subdivision and ladder argument.  It also transports the
      quotient discreteness criterion across homotopy equivalences and derives
      homotopy invariance of semilocal simple connectivity in that category,
      together with homotopy invariance of the joint-continuity boundary.
  - title: "On Fundamental Groups with the Quotient Topology"
    authors:
      - "Jeremy Brazas"
      - "Paul Fabel"
    type: "paper"
    id: "https://arxiv.org/abs/1304.6453"
    location: "Quasitopological fundamental groups and quotient-topological behavior"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      This source supplies the established research context for treating the
      compact-open loop quotient as a quasitopological invariant rather than
      necessarily a topological group.  The Lean development directly proves
      continuous induced maps, homotopy and basepoint invariance, exact
      conditional indexed-product preservation, and T1/closed-class criteria
      from Mathlib's path and quotient universal properties.
  - title: "Algebraic Topology"
    authors:
      - "Allen Hatcher"
    type: "book"
    id: "https://pi.math.cornell.edu/~hatcher/AT/AT.pdf"
    location: "Chapter 1, fundamental groups of the circle and finite products"
    relationship: "background"
    author_endorsement: "n/a"
    note: >-
      The algebraic circle and finite-torus classifications are classical.
      The present artifact additionally checks explicit compact-open
      continuity and quotient-topological consequences.
  - title: "Topological Semantics for Scoped Computational Paths"
    authors:
      - "Arthur Freitas Ramos"
      - "Ruy J. G. B. de Queiroz"
      - "Anjolina Grisi de Oliveira"
      - "Tiago M. L. de Veras"
    type: "paper"
    id: "https://github.com/Arthur742Ramos/ComputationalPathsLean/blob/2a2baa1f31c68f0e696021db91f8381dd2854652/paper/topological/main.tex"
    location: "Final-versus-ordinary quotient topology and winding validation"
    relationship: "adapts"
    author_endorsement: "participated"
    note: >-
      The follow-up builds on the accepted focused extraction but adds the
      space-independent functorial, basepoint-invariant,
      product-compatible quasitopological-group theory, the discreteness
      criterion, and the all-finite-dimensional torus application.

