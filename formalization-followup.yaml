status:
  scope: >-
    The selected declaration is exactly
    `TopologicalComputationalPathsFollowup.topological_smith_exactness` in
    `FollowupSolution.lean`.  It asserts a nonempty
    `TopologicalSmithExactnessCertificate`.  Its six fields are: (i) a
    quotient-to-winding homeomorphism for the based loop quotient of every
    finite torus; (ii) the canonical matrix-composition identity; (iii) the
    rectangular lattice-cokernel profile under injectivity of the second map,
    giving cardinality, finiteness, prime-support, and coprime-exponent laws;
    (iv) the arbitrary-rank Smith additive equivalence, finite iff full target
    rank, exponent-lcm identity, and prime-support identity; (v) the
    nonsingular square determinant-index formula; and (vi) the finite
    prime-power refinement with its exact cardinality product.  The matrix
    fields concern the integer winding lattice cokernels; the declaration does
    not state short-exact or first-isomorphism wrappers for torus maps.
    Free directions are represented explicitly by `ZMod 0`.  Centrality,
    binary/indexed products, broader matrix APIs, and other quotient-topology
    declarations remain repository support outside this Comparator target.
    The Challenge has one deliberate statement-side `sorry`; the selected
    Solution and imported development have none.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "TopologicalComputationalPathsFollowup.topological_smith_exactness"
      file: "FollowupSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-followup.json"
      selected_fields:
        - "TopologicalSmithExactnessCertificate.topological_winding_homeomorph"
        - "TopologicalSmithExactnessCertificate.matrix_composition"
        - "TopologicalSmithExactnessCertificate.rectangular_composition_profile"
        - "TopologicalSmithExactnessCertificate.smith_cokernel_profile"
        - "TopologicalSmithExactnessCertificate.determinant_index"
        - "TopologicalSmithExactnessCertificate.prime_power_torsion_profile"
      literature_dependencies:
        - statement: "Quotient fundamental groups and winding classification"
          source: "Algebraic Topology"
        - statement: "Smith invariant factors and determinant index"
          source: "Finitely Generated Abelian Groups and Similarity of Matrices over a Field"
        - statement: "Quotient-topological fundamental-group context"
          source: "On Fundamental Groups with the Quotient Topology"
        - statement: "Computational-path parent setting"
          source: "Topological Semantics for Scoped Computational Paths"
      excluded_repository_results:
        - "torus-map short exactness and first-isomorphism wrappers"
        - "relative-centrality and path-choice transport criteria"
        - "binary or indexed product-preservation claims"
        - "unselected CRT, annihilator, image, kernel, and broader matrix families"

research_interest:
  audience: "Researchers in algebraic topology, general topology, computational algebra, and formalized mathematics"
  selected_contribution: >-
    `TopologicalComputationalPathsFollowup.topological_smith_exactness` is a
    six-field certificate connecting a topological quotient with computable
    integer invariants.  It identifies each finite-torus based loop quotient
    with `Fin n → ℤ`, then records matrix composition and exact rectangular
    lattice-cokernel laws for cardinality, finiteness, prime support, and
    coprime exponents.  Its Smith profile handles arbitrary rank, including
    `ZMod 0` free factors, and its finite refinement exposes prime-power
    cyclic factors.  The determinant-index identity is the nonsingular square
    specialization.  The selected statement does not include the repository's
    separate torus-map short-exact or first-isomorphism wrappers.
  why_nontrivial: >-
    The content is a quantified bridge rather than a single determinant
    calculation: the topological quotient is identified with a lattice model,
    and one certificate simultaneously covers all finite dimensions and all
    rectangular ranks.  The composition profile remains meaningful for
    singular maps, separates finite torsion from `ZMod 0` free directions,
    and gives exact prime support and coprime-exponent behavior.  The Smith
    and prime-power fields make the invariants usable for computation, while
    the determinant formula is isolated to the square nonzero-determinant
    case.  These interfaces provide a reusable formal theorem for subsequent
    maps of finite tori without claiming new topology for unrelated spaces.
  paper_worthiness: >-
    The selected theorem is a compact, auditable formal synthesis: a genuine
    quotient-topological fundamental group is reduced to an integer lattice,
    and the same declaration supplies arbitrary-rank composition, Smith,
    determinant-index, and prime-power invariants.  The exact finite/free
    boundary and prime-support laws apply uniformly to rectangular maps,
    while the square determinant identity supplies a sharp specialization.
    This makes the certificate a reusable note-sized interface between
    algebraic topology and computational abelian-group calculations.  The
    classical ingredients and their sources are listed explicitly; no claim
    is made that winding or Smith normal form was first discovered here.
  literature_boundary: >-
    Hatcher and Norman provide the classical winding and Smith/invariant-factor
    background, while Brazas--Fabel and Calcut--McCarthy provide the
    quotient-topological context.  The parent computational-path manuscript
    is recorded as background and the pinned Mathlib revision as a related
    formalization dependency.  The local source is recorded as a
    `formalization` with relationship `formalizes`: it is the substantive Lean
    development adapted into the standalone Comparator surface.  The metadata
    makes no priority claim for the bundled theorem; it distinguishes the
    repository's formal packaging from the classical mathematical results.
  evidence:
    - "FollowupChallenge.lean: TopologicalSmithExactnessCertificate.topological_winding_homeomorph"
    - "FollowupChallenge.lean: TopologicalSmithExactnessCertificate.matrix_composition"
    - "FollowupChallenge.lean: TopologicalSmithExactnessCertificate.rectangular_composition_profile"
    - "FollowupChallenge.lean: TopologicalSmithExactnessCertificate.smith_cokernel_profile"
    - "FollowupChallenge.lean: TopologicalSmithExactnessCertificate.determinant_index"
    - "FollowupChallenge.lean: TopologicalSmithExactnessCertificate.prime_power_torsion_profile"
    - "FollowupSolution.lean: TopologicalComputationalPathsFollowup.topological_smith_exactness"

