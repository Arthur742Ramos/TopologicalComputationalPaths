fidelity:
  divergences: >-
    The selected artifact is a standalone Comparator presentation of a
    three-layer certificate: two general quotient-topology criteria followed by
    a nine-top-level-field topology-to-arithmetic certificate.  It is not a
    new claim about the individual classical ingredients.  The first two
    selected fields identify covering-map images with monodromy stabilizers and state
    the sharp product-quotient obstruction.  The certificate's third field gives the
    rectangular winding-lattice short exact sequence and first-isomorphism quotient;
    its fourth field includes the
    actual winding/group classifier, its naturality for induced matrix maps,
    exact image/faithfulness criteria, and the Smith-coordinate image
    obstruction for actual induced quotient maps.  The selected abstract-trace
    bridge supplies an explicit raw family, realizes every loop through its
    declared section, supplies a winding-indexed one-step normal form with
    proved trace length and homotopy completeness, and applies the same
    winding/Smith test to its geometric representatives.  It proves the exact
    shortest-trace law (zero winding iff minimum length zero, otherwise minimum
    length one), matrix naturality of the normal form, and path-map composition
    up to endpoint-fixed homotopy.  It also proves abstract path-level Smith
    realizability: a traced target is homotopic to a mapped source loop iff its
    Smith coordinates satisfy the displayed divisibility equations.  The
    remaining profiles are on integer
    winding-lattice cokernels.
