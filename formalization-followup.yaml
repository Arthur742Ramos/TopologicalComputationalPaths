      module: "ComputationalPaths/Path/Topology/FiniteTorusWinding.lean"
      status: "proved"
      note: "Arbitrary integer matrices extend coordinate selections to continuous torus maps; their matrix actions and quotient maps are natural, functorial, and satisfy exact image, kernel, injectivity, and surjectivity transfer.  For nonzero determinant, the winding-lattice cokernel is finite with cardinality Int.natAbs (Matrix.det A), and finiteness is exposed explicitly.  Its full-rank image is also presented by a Smith-normal-form product of finite cyclic ZMod factors.  At the canonical basepoint, the induced quotient image has the same exact index and cokernel cardinality, with an explicit finite quotient theorem; the quotient cokernel itself is transported to the same Smith-normal-form product by an explicit additive equivalence of finite abelian groups.  For arbitrary rectangular maps, the quotient winding equivalence has a representative formula, exact Nat.card and Finite transport for maps and composites, and naturality for both cokernel maps; the rectangular diagram certificate packages both exact sequences and commuting squares.  For composable non-singular square matrices, the determinant index is multiplicative under matrix composition on both the lattice and quotient sides.  The arbitrary-basepoint quotient homomorphisms commute with path transport, satisfy typed composition and identity laws with explicit endpoint casts, and both the path-based and canonical classifier squares include the endpoint cast explicitly; the exact image, kernel, injectivity, and surjectivity criteria transfer there as well.  Explicit two-sided matrix inverses upgrade the lattice action to a continuous additive equivalence, the torus map to a homeomorphism, and the quotient map to both a homeomorphism and a continuous additive equivalence.  At every arbitrary basepoint, the quotient homomorphism itself upgrades to a continuous multiplicative equivalence with explicit injectivity and surjectivity consequences."
