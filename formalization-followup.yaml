    equality of topological basepoint transports, packaged with the
    quotient-topology continuity boundary and finite-torus profile.  The
    declaration preserves the binary quotient-map hypothesis and excludes
    arbitrary indexed products.  Broader repository matrix developments are
    supporting material, not selected results.

