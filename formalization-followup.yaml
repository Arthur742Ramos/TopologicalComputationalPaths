      note: >-
        The compact-open/final quotient loop space of every finite torus is
        homeomorphic to its integer winding lattice.
    - source: "Canonical winding-lattice matrix composition"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.matrix_composition"
      module: "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean"
      status: "proved"
      note: >-
        The canonical additive matrix action composes according to the stated
        row-by-column `matrixCompose` law in all finite dimensions.
    - source: "Rectangular lattice-cokernel composition profile"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.rectangular_composition_profile"
      module: "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean"
      status: "proved"
      note: >-
        Under injectivity of the second rectangular lattice action, successive
        lattice-cokernel cardinalities multiply, finiteness is equivalent to
        finiteness of the composite, prime support is the union of successive
        supports, and coprime exponents multiply exactly.
    - source: "Arbitrary-rank Smith classification of the winding-lattice cokernel"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.smith_cokernel_profile"
      module: "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean"
      status: "proved"
      note: >-
        The selected field gives the additive Smith equivalence, preserves
        `ZMod 0` free factors, characterizes lattice-cokernel finiteness by
        full target rank, and identifies exponent and prime support from the
        Smith moduli.
    - source: "Square determinant-index specialization"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.determinant_index"
      module: "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean"
      status: "proved"
      note: >-
        For a nonsingular square matrix, the winding-lattice cokernel
        cardinality equals the absolute determinant.
    - source: "Finite prime-power Smith refinement"
      lean: "TopologicalComputationalPathsFollowup.topological_smith_exactness; TopologicalSmithExactnessCertificate.prime_power_torsion_profile"
      module: "ComputationalPaths/Path/Topology/TopologicalSmithExactness.lean"
      status: "proved"
      note: >-
        When every Smith modulus is nonzero, the finite winding-lattice
        cokernel is explicitly equivalent to its product of prime-power cyclic
        factors, with the exact product cardinality formula.

