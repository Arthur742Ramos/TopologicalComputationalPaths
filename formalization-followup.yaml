version: "v0.4"

project:
  name: "Topological Smith Classification and Composition for Finite-Torus Quotients"
  description: >-
    This follow-up selects
    `TopologicalComputationalPathsFollowup.topological_smith_exactness`.
    It is a kernel-checked certificate with six fields.  The first field gives
    a homeomorphism from the compact-open quotient of based loops in each
    finite torus to its integer winding lattice.  The remaining fields state
    canonical matrix composition and exact rectangular lattice-cokernel
    profiles: cardinality, finiteness, prime support, and coprime exponent
    composition; arbitrary-rank Smith factors including `ZMod 0` free
    directions; the nonsingular square determinant index; and a finite
    prime-power refinement.  The selected declaration therefore records a
    precise topology-to-arithmetic bridge.  Short-exact torus-map wrappers,
    first-isomorphism packaging, indexed products, centrality, CRT, and other
    matrix APIs remain repository support and are not selected claims.
  authors:
    - "Arthur Freitas Ramos"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina Grisi de Oliveira"
    - "Tiago M. L. de Veras"
    - "David Barros Hulak"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

