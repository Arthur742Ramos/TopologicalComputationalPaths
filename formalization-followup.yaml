version: "v0.4"

project:
  name: "Homotopy-Invariant Quotient Fundamental Groups, Sharp Products, and Finite-Torus Winding"
  description: >-
    A Lean formalization of the quotient-topological fundamental group of an
    arbitrary pointed space.  It proves continuous induced homomorphisms with
    identity and composition laws, preservation of path-class concatenation,
    invariance under homotopy equivalence and change of basepoint along a path
    (including path-homotopy independence, identity, composition, and reversal
    coherence,
    naturality under continuous maps, basepoint invariance of the
    joint-continuity boundary, and the pointed fixed-basepoint homotopy
    corollary, the path-connected all-basepoints joint-continuity and
    discreteness criteria, and the homotopy-invariant global continuity
    criterion, as well as the one-basepoint semilocal criterion in the
    locally path-connected, path-connected setting, and the homotopy- and
    path-invariant T1 separation boundary),
    and preservation of arbitrary indexed products
    under the exact product-quotient hypothesis.  It proves sharp
    failure of that hypothesis when multiplication is discontinuous, exact
    T1 and discreteness criteria, semilocal consequences, covering-map
    consequences including homotopy invariance in the locally path-connected
    category, covering-map injectivity with a monodromy-stabilizer image
    theorem, and the precise
    topological-group agreement boundary.  Every finite torus is classified
    by explicit winding as a discrete integer lattice, with discreteness
    transported to every basepoint, with a common integer-lattice model, and
    semilocal simple connectivity proved at every torus point.  The winding
    classifier is also a continuous multiplicative equivalence to
    `Multiplicative (Fin n → ℤ)`, and quotient multiplication is proved
    commutative at every torus basepoint.  In an abelian target quotient,
    basepoint transport is independent of the chosen path even without an
    endpoint-fixed homotopy between paths, yielding a canonical path-based
    finite-torus lattice classifier.  More generally, equality of transports
    is equivalent to centrality of the relative loop in the target quotient.
    The winding classifier is natural under coordinate-selection maps between
    finite tori, reindexing the integer lattice vector before and after
    passage to the quotient; the continuous multiplicative lattice classifier
    satisfies the same law across dimensions.  Both the coordinate maps and
    their lattice reindexings satisfy identity and composition coherence laws,
    and the standard representatives and quotient decoder obey the same
    reindexing equation.  The path-based lattice classifier also satisfies
    the corresponding naturality square at arbitrary torus basepoints after
    mapping the chosen transport path.  The canonical arbitrary-basepoint
    classifier satisfies the same square without exposing any path choice.
    The lattice reindexings are continuous additive morphisms, and their
    continuous identity/composition laws are proved explicitly.
    For finite index equivalences, the coordinate map is a torus homeomorphism
    and the lattice reindexing is a continuous additive equivalence, with
    matching identity/composition coherence.
    The arbitrary-basepoint classifier naturality squares are also stated
    directly through the continuous additive reindexing morphism.
    Surjective and injective index maps have the corresponding exact
    injectivity and surjectivity behavior at the torus, lattice, and typed
    quotient levels, including the converses.  Typed quotient coordinate
    maps compose contravariantly and are additive homomorphisms for the
    transported winding groups; their kernels are exactly the classes whose
    winding vanishes on the image of the index map.  At arbitrary torus
    basepoints, coordinate selection is also exposed as a continuous
    multiplicative homomorphism between the corresponding quotient
    fundamental groups, with explicit identity/composition coherence and a
    direct classifier-naturality corollary.  The canonical classifiers also
    transport the exact fiber-constant image, injectivity/surjectivity
    converse, and kernel descriptions to arbitrary torus basepoints.  The
    finite-torus layer also extends coordinate selections to arbitrary integer
    matrices: continuous matrix maps and continuous lattice actions use
    ordinary row-by-column multiplication, with natural standard representatives,
    quotient maps, exact image/kernel/injectivity/surjectivity transfer, and
    additive identity/composition coherence.  At arbitrary torus basepoints,
    the matrix maps are exposed as continuous multiplicative quotient
    homomorphisms commuting with explicit basepoint transport, and the
    path-based classifier naturality square is proved with its endpoint cast
    explicit.  Abelian-target path independence gives the same naturality
    square for the canonical arbitrary-basepoint classifier.  The canonical
    classifier also transfers the exact matrix image, kernel,
    injectivity/surjectivity iff criteria to every chosen basepoint, each as
    an explicit theorem.  The arbitrary-basepoint homomorphisms additionally
    satisfy typed contravariant composition and identity laws with explicit
    endpoint casts.
    For square matrices, lattice and canonical quotient injectivity are
    equivalent to a nonzero determinant, while surjectivity is equivalent to
    a unit determinant.  The canonical adjugate-based nonsingular inverse of a
    unimodular matrix supplies all corresponding equivalence layers, including
    arbitrary basepoints.
    For every nonzero determinant, the winding-lattice cokernel is finite with
    cardinality exactly `Int.natAbs (Matrix.det A)`, and finiteness is exposed
    explicitly as a quantitative index certificate.
    At the canonical finite-torus basepoint, the induced quotient image has the
    same exact index and cokernel cardinality, with an explicit finiteness
    theorem identifying the topological quotient obstruction with the
    determinant index.
    For composable non-singular square matrices, the determinant index is
    multiplicative under matrix composition on both the lattice and canonical
    quotient cokernel.
    Composition by a non-singular matrix `B` also induces a canonical additive
    map from the cokernel of `A` into that of `B ∘ A`, proved injective on both
    the winding lattice and the topological quotient.
    The projection from the cokernel of `B ∘ A` onto the cokernel of `B` is
    surjective with exactly that image as its kernel, giving a short exact
    sequence on both sides.
    Quotienting the composition cokernel by the projection kernel is also
    identified with the cokernel of `B` by an explicit first-isomorphism
    additive equivalence, including a proved representative formula.
    The cokernel argument is factored through a reusable first-isomorphism
    package for arbitrary composable additive homomorphisms.  Rectangular
    integer matrices in any composable dimensions therefore inherit the same
    short-exact sequence under injectivity of the second matrix action, and
    the corresponding finite-torus quotient maps satisfy the transported
    theorem as well.
    The winding equivalence lifts to explicit rectangular cokernel
    equivalences, transports cardinality and finiteness for individual maps
    and composites, and proves both winding-commuting squares; a single
    diagram certificate packages these exactness and naturality statements.
    The Smith-normal-form product is generalized to arbitrary-rank rectangular
    maps: complementary coordinates contribute explicit ZMod 0 free factors,
    while embedded Smith coordinates contribute cyclic torsion factors.  Under
    full target rank the exact product of Smith moduli is transported to both
    lattice and finite-torus cokernels.  The same factorization gives an exact
    finiteness criterion: both cokernels are finite exactly when every Smith
    modulus is nonzero, equivalently when no ZMod 0 free factor remains.
    In the square nonsingular specialization, the Smith-modulus product is
    also proved equal to the determinant index Int.natAbs (Matrix.det A) on
    both the lattice and finite-torus sides.
    The arbitrary-rank presentation also proves the exact Nat.card product
    formula without a finiteness assumption, including the infinite ZMod 0
    cases.
    Smith coordinates also give exact divisibility membership tests for the
    lattice and finite-torus matrix images, including zero-factor equations.
    The topological arbitrary-rank Smith equivalence also has an explicit
    quotient-representative formula for direct loop-class decoding.
    Whenever all Smith moduli are nonzero, the cyclic factors are refined by
    the Chinese remainder theorem into an explicit product of prime-power
    cyclic groups on both lattice and finite-torus cokernels, with a proved
    representative formula for the refined decoder.
    The refined product has an exact cardinality certificate: its prime-power
    orders multiply back to each Smith modulus, identifying both cokernel
    cardinalities with the resulting full double product.
    Its additive exponent is also identified exactly with the least common
    multiple of the Smith moduli, exposing the precise finite-cokernel
    annihilator.
    The same Smith coordinates give an elementwise annihilation criterion:
    a multiple of a lattice or finite-torus cokernel class vanishes exactly
    when each transformed coordinate is divisible by the corresponding
    multiple of its Smith factor, including the zero-factor equations.
    For every square matrix, the adjugate gives an explicit preimage of each
    determinant multiple, so the determinant annihilates every lattice and
    finite-torus cokernel class, including singular matrices; this certificate
    does not assume a nonzero determinant.
    The abstract induced map has an exact injectivity criterion given by
    equality of the preimage of the composite image with the first image.
    The non-singular lattice cokernel is additionally presented by an explicit
    Smith-normal-form product of finite cyclic `ZMod` factors, and the same
    cyclic-factor presentation is transported to the canonical quotient
    cokernel of the induced torus homomorphism as an explicit additive
    equivalence of finite abelian groups.
    An explicit two-sided integer-matrix inverse further yields a continuous
    additive lattice equivalence, a torus homeomorphism, and quotient
    homeomorphism and continuous additive equivalence for the transported
    loop-class groups.  At every arbitrary torus basepoint, it also yields a
    continuous multiplicative quotient equivalence with explicit injectivity
    and surjectivity consequences.
