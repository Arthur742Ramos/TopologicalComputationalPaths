version: "v0.4"

project:
  name: "Quotient Fundamental Groups, Winding, and Smith Exactness"
  description: >-
    This follow-up selects
    `TopologicalComputationalPathsFollowup.topological_smith_exactness`.
    Its proposition is the nonemptiness of a kernel-checked certificate with
    nine top-level fields, grouped into three layers.  The first two fields are
    the general covering-map theorem that the image of the induced quotient
    fundamental-group map is exactly the stabilizer of the lifted endpoint
    under monodromy, and the sharp product theorem: if quotient multiplication
    is not jointly continuous, the product of the two loop-quotient projections
    cannot be a quotient map.  The third field records the rectangular
    winding-lattice short exact sequence and its first-isomorphism quotient;
    the remaining six fields give a coherent family
    of complete winding classifiers: each classifier agrees
    with the explicit winding invariant on every loop representative,
    identifies quotient concatenation with addition in the integer lattice
    through a continuous equivalence into the multiplicative lattice model,
    and intertwines the induced integer-matrix map on finite-torus loop
    quotients with the matrix action on winding vectors.  It also proves exact
    image, injectivity, and surjectivity transfer for those quotient maps,
    including the square determinant criteria.  It also decides image
    membership for the induced quotient map by finite Smith-coordinate
    divisibility tests, including the zero-factor constraints in rank-deficient
    cases.  The remaining fields state
    canonical matrix composition and exact rectangular lattice-cokernel
    profiles: finite-cokernel cardinality products, finiteness equivalences,
    finite-cokernel prime support, and coprime exponent composition;
    arbitrary-rank Smith factors including `ZMod 0` free directions; the
    nonsingular square determinant index; and a finite prime-power refinement.
    The certificate deliberately restricts cardinality and prime-support
    conclusions to finite cokernels.  A zero Smith factor is instead an
    explicit `ZMod 0` free direction; in that case Mathlib's totalized
    `Nat.card = 0` and exponent-zero conventions are recorded, not ordinary
    finite cardinality or torsion-prime support.  The selected declaration
    therefore records a precise topology-to-arithmetic bridge with an explicit
    covering-space image criterion and a sharp quotient-topology boundary.  Its selected
    nested bridge is an abstract traced presentation of based finite-torus
    loops.  Its raw family, trace operations, geometric loop map, and
    homotopy-class quotient are explicit interface data: trace length is
    preserved by identity, composition, and reversal, every continuous loop
    has a representative, and the same Smith image test applies to that
    representative's winding class.  For every winding vector it supplies a
    canonical one-step representative, proves its chosen winding, and proves
    homotopy completeness.  The minimum trace length in a homotopy class is
    exactly zero for zero winding and exactly one otherwise.  Matrix maps send
    each standard traced loop to the standard trace of the matrix-action
    winding up to endpoint-fixed homotopy, and successive maps compose up to
    endpoint-fixed homotopy.  The standard trace for a sum is homotopic to the
    concatenation of the summand traces, and the zero-winding standard trace
    is homotopic to the traced identity.  Whenever the matrix-action winding
    is nonzero, the mapped canonical trace has a one-step target
    representative and every homotopic target trace has at least one step.
    It also proves abstract path-level Smith realizability: a traced target
    loop is homotopic to the mapped geometric loop of some source loop exactly
    when its Smith coordinates satisfy the divisibility equations.  Two
    explicit compatibility fields identify the abstract bridge's winding and
    quotient classifier with the selected certificate's own fields.  The
    declaration does not identify this abstract raw family with the
    repository's `ComputationalPaths.Path` syntax and does not assert an
    endpoint-varying open-path carrier; those developments are repository
    support outside this Comparator selection.
    Short-exact torus-map wrappers,
    first-isomorphism packaging, indexed products, centrality, CRT, and other
    matrix APIs remain repository support and are not selected claims.
  authors:
    - "Arthur Freitas Ramos"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina Grisi de Oliveira"
    - "Tiago M. L. de Veras"
    - "David Barros Hulak"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

