# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Homotopy-Invariant Quotient Fundamental Groups, Sharp Products, and Finite-Torus Winding"
  description: >-
    A Lean formalization of the quotient-topological fundamental group of an
    arbitrary pointed space.  It proves continuous induced homomorphisms with
    identity and composition laws, preservation of path-class concatenation,
    invariance under homotopy equivalence and change of basepoint along a path
    (including path-homotopy independence, identity and composition coherence,
    naturality under continuous maps, basepoint invariance of the
    joint-continuity boundary, and the pointed fixed-basepoint homotopy
    corollary, the path-connected all-basepoints joint-continuity and
    discreteness criteria, and the homotopy-invariant global continuity
    criterion, as well as the one-basepoint semilocal criterion in the
    locally path-connected, path-connected setting, and the homotopy- and
    path-invariant T1 separation boundary),
    and preservation of arbitrary indexed products
    under the exact product-quotient hypothesis.  It proves sharp
    failure of that hypothesis when multiplication is discontinuous, exact
    T1 and discreteness criteria, semilocal consequences, covering-map
    consequences including homotopy invariance in the locally path-connected
    category, covering-map injectivity with a monodromy-stabilizer image
    theorem, and the precise
    topological-group agreement boundary.  Every finite torus is classified
    by explicit winding as a discrete integer lattice, with discreteness
    transported to every basepoint, with a common integer-lattice model, and
    semilocal simple connectivity proved at every torus point.  The winding
    classifier is also a continuous multiplicative equivalence to
    `Multiplicative (Fin n → ℤ)`, and quotient multiplication is proved
    commutative at every torus basepoint.
  authors:
    - "Arthur Freitas Ramos"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina Grisi de Oliveira"
    - "Tiago M. L. de Veras"
    - "David Barros Hulak"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

