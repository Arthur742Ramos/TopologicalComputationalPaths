    file: RoadmapRegistrySolution.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    comparator_config: comparator-registry-roadmap.json
  - declaration: TopologicalComputationalPathsRoadmapRegistry.ordinary_composition_continuous
    file: RoadmapRegistrySolution.lean
    sorry_count: 0
    axioms:
