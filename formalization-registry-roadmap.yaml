    - Quot.sound
    comparator_config: comparator-registry-roadmap.json
research_interest:
  audience: Researchers studying quotient topologies, topological groupoids, and formalized
    topology.
  selected_contribution: An open quotient map on arrows induces a quotient map on the ordinary
    composable-pair pullback, without continuity assumptions on the endpoint functions. A
    multiplication law is continuous when its raw pullback is continuous.
  why_nontrivial: The composable-pair subspace is a full inverse image under the product arrow
    map. Openness survives restriction to this inverse image, so the induced map is quotient.
    This supplies the topology transfer needed by the scoped-path application.
  paper_worthiness: The selected statements form one technical step in the revised paper and
    are standard quotient-topology consequences. Their value is as reusable checked infrastructure;
    the larger finite-presentation and topology-separation results in the repository are not
    selected here.
  literature_boundary: The open-map step is standard general topology. Holkar, Hossain, and
    Kulkarni supply the published global path-class openness theorem used in the paper, which
    this selection does not prove.
  evidence:
  - 'RoadmapRegistryChallenge.lean: two standalone statements'
  - 'RoadmapRegistrySolution.lean: two proofs'
  - 'ComputationalPaths/Path/Topology/ScopedGeometricRewriteGroupoid.lean: scoped application'
