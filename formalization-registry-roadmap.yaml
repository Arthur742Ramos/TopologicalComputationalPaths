status:
  scope: Two Mathlib-only statements isolate the ordinary composable-pair quotient and the
    resulting continuity transfer for multiplication. They are general topological lemmas.
    The direct Lean proof of universal path-class openness, product sorting, finite circle
    and torus global based-fiber homeomorphisms, and trace-sensitive separation remain outside
    this external selection, although source proofs for all but universal openness are present
    in the repository.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
