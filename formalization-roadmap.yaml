status:
  scope: >-
    TopologicalComputationalPathsRoadmap.roadmap_result in RoadmapSolution.lean
    is a proposition-valued certificate with explicit fields for the completed
    roadmap results. The challenge imports the substantive development, and
    the solution assembles its independently checked declarations. It is an
    aggregation selection, not a claim that the imported proofs are new to
    the bundle. Both the general locally path-connected semilocal theorem and
    the totally disconnected case are selected.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "TopologicalComputationalPathsRoadmap.roadmap_result"
      file: "RoadmapSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-roadmap.json"
      selected_fields:
        - "RoadmapCertificate.universal_projection_quotient"
        - "RoadmapCertificate.universal_projection_open"
        - "RoadmapCertificate.universal_product_unconditional"
        - "RoadmapCertificate.universal_composition_unconditional"
        - "RoadmapCertificate.universal_based_fiber_unconditional"
        - "RoadmapCertificate.universal_totally_disconnected_homeomorph"
        - "RoadmapCertificate.open_arrow_product"
        - "RoadmapCertificate.final_projections"
        - "RoadmapCertificate.universal_open_product"
        - "RoadmapCertificate.universal_based_fiber"
        - "RoadmapCertificate.universal_based_discrete"
        - "RoadmapCertificate.product_based_complete"
        - "RoadmapCertificate.primitive_product_rewrite_equivalence"
        - "RoadmapCertificate.primitive_product_based_complete"
        - "RoadmapCertificate.finite_circle_complete"
        - "RoadmapCertificate.finite_torus_complete"
        - "RoadmapCertificate.circle_trace_comparison"
        - "RoadmapCertificate.torus_trace_comparison"
        - "RoadmapCertificate.circle_global_fiber"
        - "RoadmapCertificate.torus_global_fiber"
        - "RoadmapCertificate.trace_section_criterion"
        - "RoadmapCertificate.duplicate_forward"
        - "RoadmapCertificate.duplicate_reverse_fails"
        - "RoadmapCertificate.discrete_arrow_product"
      literature_dependencies:
        - statement: "Openness of the global path-class quotient"
          source: "The Fundamental Groupoid: Topology, Haar System and Actions"
        - statement: "Circle and torus winding background"
          source: "Algebraic Topology"
      excluded_repository_results:
        - "Hawaiian-earring discontinuity, which uses an external assumption"
        - "longer-term edge-path and Seifert-van Kampen projects"

research_interest:
  audience: >-
    Researchers in algebraic and general topology, topological groupoids,
    computational-path semantics, and formalized mathematics.
  selected_contribution: >-
    The selected certificate connects an open-arrow criterion for ordinary
    multiplication to the semilocal universal open-map theorem, a totally
    disconnected universal homeomorphism, a global based-fiber theorem, and a general
    product-closure result for based trace completeness, and unconditional
    finite circle and torus global based-fiber homeomorphisms. It also proves
    when trace-sensitive and observable quotient topologies agree and gives a
    nonconstant duplicate-circle presentation where they differ.
  why_nontrivial: >-
    The finite global based-fiber results use a continuous winding invariant
    on the full endpoint-varying scoped arrow quotient. This is stronger than
    classifying an isolated fixed-endpoint quotient: the result uses the actual
    subspace topology inherited from the global arrow carrier. Product
    completeness is proved for a presentation with lifted factor rules and
    primitive rectangle interchange. Whole-trace interchange is derived.
    The trace separation concerns the quotient
    topologies themselves, not only the raw code spaces.
  paper_worthiness: >-
    The revised manuscript offers a clearer formal and mathematical boundary,
    with one positive geometric class, a genuine quotient-topology separation,
    product closure, and finite global based-fiber results. Its global
    topological-groupoid theorem is a direct formal proof of published work.
    Independent review remains necessary to judge novelty,
    priority, and publication suitability.
  literature_boundary: >-
    Holkar--Hossain--Kulkarni supply the classical global openness theorem;
    Hatcher supplies standard winding background. The selected Lean result
    proves the global open-map theorem, conditional transfer, and finite
    presentation statements. No
    priority claim is made for the classical ingredients.
  evidence:
    - "RoadmapChallenge.lean: RoadmapCertificate"
    - "RoadmapSolution.lean: TopologicalComputationalPathsRoadmap.roadmap_result"
    - "UniversalTotallyDisconnected.lean: universalPathClassProjection_isHomeomorph_of_totallyDisconnected"
    - "UniversalSemilocallySimplyConnected.lean: universalPathClassProjection_isOpenMap_of_semilocallySimplyConnected"
    - "FiniteCircleGlobalBasedFiber.lean: circleGlobalBasedGeometricHomeomorph"
    - "FiniteTorusGlobalBasedFiber.lean: torusGlobalBasedGeometricHomeomorph"
    - "ProductScopedSorting.lean: productBasedTraceCompleteness"
    - "ProductPrimitiveInterchange.lean: primitiveInterchangeTrace and primitiveProductBasedTraceCompleteness"
    - "TraceSensitiveSeparation.lean: duplicateQuotientComparison_not_continuous"

automation:
  methods:
    - method: "manual"
      tool_setup: "Roadmap interpretation, literature checks, manuscript revision, and source audit."
    - method: "agent"
      models: ["Codex"]
      framework: "Lean 4.32.0 and Lake"
      tool_setup: "Lean proofs, PDF build, source checks, and Comparator preparation."
      cost:
        wall_time: "multi-session local development"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Credit the cited classical theorem while reporting the direct Lean proof."
  spend_usd: "not tracked"
  notes: "Lean and Comparator replay results are recorded with the selected commit."

fidelity:
  divergences: >-
    The challenge imports the source development and selects a bundle of
    already checked declarations. Its deliberate statement placeholder is
    not an unfinished proof in the solution. The positive universal global
    based-fiber field records both the conditional transfer and its semilocal
    unconditional consequence. The product presentation first names
    whole-trace interchange for sorting; a second presentation derives it
    from primitive squares and has the same scoped rewrite relation. The finite
    circle and torus results use their exact structural presentations.

alignment:
  namespace: "TopologicalComputationalPathsRoadmap"
  statements:
    - source: "Open-arrow and universal quotient criteria"
      lean: "TopologicalComputationalPathsRoadmap.roadmap_result; RoadmapCertificate.open_arrow_product; RoadmapCertificate.universal_projection_quotient"
      module: "RoadmapSolution.lean"
      status: "proved"
      note: "The general projection-open field supplies openness under local path-connectedness and semilocal simple connectivity."
    - source: "Global universal path-class openness"
      lean: "TopologicalComputationalPathsRoadmap.roadmap_result; RoadmapCertificate.universal_projection_open; RoadmapCertificate.universal_product_unconditional; RoadmapCertificate.universal_composition_unconditional; RoadmapCertificate.universal_based_fiber_unconditional"
      module: "RoadmapSolution.lean"
      status: "proved"
      note: "Uses the local ladder, endpoint absorption, and saturation of compact-open sets."
    - source: "Conditional global universal based fiber"
      lean: "TopologicalComputationalPathsRoadmap.roadmap_result; RoadmapCertificate.universal_based_fiber; RoadmapCertificate.universal_based_discrete"
      module: "RoadmapSolution.lean"
      status: "proved"
      note: "Homeomorphism uses the actual based-arrow subspace under an open projection."
    - source: "Totally disconnected universal path-class topology"
      lean: "TopologicalComputationalPathsRoadmap.roadmap_result; RoadmapCertificate.universal_totally_disconnected_homeomorph"
      module: "RoadmapSolution.lean"
      status: "proved"
      note: "Every interval path is constant, so the quotient projection is a homeomorphism."
    - source: "Product closure of based completeness"
      lean: "TopologicalComputationalPathsRoadmap.roadmap_result; RoadmapCertificate.product_based_complete"
      module: "RoadmapSolution.lean"
      status: "proved"
      note: "Whole-trace interchange is derivable from primitive rectangles."
    - source: "Finite global based fibers and trace comparisons"
      lean: "TopologicalComputationalPathsRoadmap.roadmap_result; RoadmapCertificate.circle_global_fiber; RoadmapCertificate.torus_global_fiber"
      module: "RoadmapSolution.lean"
      status: "proved"
      note: "Subspace topology, finite based completeness, and comparison homeomorphisms."
    - source: "Trace-sensitive quotient separation"
      lean: "TopologicalComputationalPathsRoadmap.roadmap_result; RoadmapCertificate.duplicate_reverse_fails"
      module: "RoadmapSolution.lean"
      status: "proved"
      note: "The reverse map between the two quotient topologies is not continuous."

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Local Lean checks establish mechanical soundness of the selected theorem;
    external mathematical and editorial review is pending.

acknowledgements: >-
  Thanks to the cited authors and to contributors to Lean, Mathlib, and the
  Calculus of Computational Paths.
