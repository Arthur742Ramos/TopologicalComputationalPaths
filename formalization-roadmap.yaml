version: "v0.4"

project:
  name: "Topological semantics of scoped computational paths"
  description: >-
    A selected Lean certificate for the revised topological-semantics paper:
    open-arrow product compatibility, the semilocal and totally disconnected
    universal open-map cases, universal based-fiber topology, product closure
    of based completeness, finite circle and torus
    global based-fiber homeomorphisms, and trace-sensitive quotient comparisons.
    General openness of the universal endpoint-varying path-class projection
    under local path-connectedness and semilocal simple connectivity is
    selected as a Lean proof and credited to the prior literature.
  authors:
    - "Arthur Freitas Ramos"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina Grisi de Oliveira"
    - "Tiago M. L. de Veras"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.AT", "math.GN"]
  msc2020: ["55Q05", "54B15", "55M20"]

