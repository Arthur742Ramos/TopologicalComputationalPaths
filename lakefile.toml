name = "TopologicalComputationalPaths"
version = "0.1.0"
defaultTargets = ["ComputationalPaths", "Challenge", "Solution", "FollowupChallenge", "FollowupSolution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "ComputationalPaths"
roots = ["ComputationalPaths"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_lib]]
name = "FollowupChallenge"
roots = ["FollowupChallenge"]

[[lean_lib]]
name = "FollowupSolution"
roots = ["FollowupSolution"]
