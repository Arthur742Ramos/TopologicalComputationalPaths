name = "TopologicalComputationalPaths"
version = "0.1.0"
defaultTargets = ["ComputationalPaths", "Challenge", "Solution", "FollowupChallenge", "FollowupSolution", "PreimageChallenge", "PreimageSolution", "PreimageTests", "PreimageAdversarial", "PreimageBenchmarks"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "ComputationalPaths"
roots = ["ComputationalPaths"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "ChallengePrelude"
roots = ["ChallengePrelude"]

[[lean_lib]]
name = "ChallengeCertificate"
roots = ["ChallengeCertificate"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_lib]]
name = "FollowupChallenge"
roots = ["FollowupChallenge"]

[[lean_lib]]
name = "FollowupSolution"
roots = ["FollowupSolution"]

[[lean_lib]]
name = "PreimageTests"
roots = ["PreimageTests"]

[[lean_lib]]
name = "PreimageAdversarial"
roots = ["PreimageAdversarial"]

[[lean_lib]]
name = "PreimageBenchmarks"
roots = ["PreimageBenchmarks"]

[[lean_lib]]
name = "PreimageChallenge"
roots = ["PreimageChallenge"]

[[lean_lib]]
name = "PreimageSolution"
roots = ["PreimageSolution"]
