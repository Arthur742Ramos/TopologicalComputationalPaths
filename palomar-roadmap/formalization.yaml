fidelity:
  divergences: The Comparator challenge states the abstract open-arrow pair quotient, multiplication-continuity
    transfer, and ordinary geometric circle and torus loop-quotient homeomorphisms. It does
    not select the 17-field internal roadmap bundle, the finite scoped global based-fiber
    homeomorphisms, product sorting, or trace-sensitive separation. Universal path-class openness
    remains cited rather than formalized.
